authority_impact: none
trigger: "Current researchExperimentComposition materializes only the 1m manifest after verified Upbit REST candle backfill/gap fill, while configured 15m/60m orchestrators resolve manifests by their own interval and therefore remain missing-manifest. Existing manifest materializer and AggregatedResearchCandleSource already enforce explicit OHLCV, complete contiguous 1m base coverage, raw-source receipts, and deterministic content identity."
objective: "Integrate the #2975 bounded REST gap-fill/head-refresh contract with #3002 verified multi-interval manifest materialization, using #2984's current two-hour stale ceiling without treating it as a collection cadence. Preserve strict source provenance and all research safety gates."
scope:
  - "Reuse the existing SqliteResearchDatasetManifestStore, SqliteResearchCandleStore, AggregatedResearchCandleSource, and materializeResearchDatasetManifest."
  - "For each configured interval, derive complete target candles from the same bounded 1m source window and use an interval-specific stable source identity."
  - "Keep one existing gap-fill timer at 15 minutes with one source page per market/pass; alternate HEAD and HISTORY attempts so the nominal head revisit is 30 minutes, within the two-hour maximum-age rule. Do not interpret that stale ceiling as a required fetch interval."
  - "Persist the history cursor and next pass in SQLite per market; retain the last verified cursor on request, malformed-page, or storage failure; reject non-advancing repeated source pages before recording them."
  - "Do not overwrite historical cursor progress with a HEAD result. Alternate the next pass after failures too, so recurring failure of either work class cannot starve the other. Keep market failures isolated."
  - "After a complete startup backfill, create a manifest when that interval has none and retry missing manifests at most hourly when source evidence is unchanged; a new source watermark or newly recorded row may trigger an earlier retry. Recalculate existing manifests only when source rows or that interval's complete input close advances, reusing immutable identities otherwise."
  - "Preserve per-interval fail-closed behavior and safe diagnostic logging; materialization remains impossible without complete raw-source receipts and explicit OHLCV."
  - "Add production-shaped tests proving 1m/15m/60m manifests are generated from explicit Upbit OHLCV receipts on both success paths, and missing/incomplete source evidence still creates no manifest."
  - "Add restart, cursor replay, head/history fairness, one-page bounds, and unchanged-manifest no-recompute regression tests."
  - "Keep all configured intervals, manifest IDs, candle contents, and source receipts deterministic for identical input."
exclusions:
  - "No ticker-derived candles, synthetic candles/volume/receipts, or closedCandleAggregator wiring into canonical OHLCV."
  - "No change to manifest requirements, PIT/OOS, qualification, session acceptance, risk, writer lease, readiness, execution, LIVE, or AI authority."
  - "No DB/history rewrite, deployment, restart, production mutation, or issue closure based on tests alone."
  - "PR #3001 remains display-only; PR #3000 and #2979/#2980 rolling-holdout changes remain separately owned. This order incorporates only the #2975 bounded REST gap-fill, cursor, and freshness scheduling behavior; it does not claim or close #2975 review threads."
acceptance:
  - "Configured 1m, 15m, and 60m orchestrators can resolve only manifests materialized from verified contiguous Upbit 1m OHLCV and complete source receipts."
  - "An absent candle, absent volume, missing source receipt, mixed/malformed source material, content mismatch, or unsupported interval does not produce a manifest and does not start Research with fabricated evidence."
  - "Identical source candles and provenance produce the same manifest identity; no manifest is treated as a session, qualification, PAPER, or learning-cycle receipt."
  - "A repeated/non-advancing provider page returns a fail-closed error and does not advance the durable cursor; progress resumes after process/database reopen."
  - "A corrupt durable cursor fails closed per market while the next configured market is still processed."
  - "Unchanged NO_GAPS/FILLED passes do not recompute manifests; changed or newly complete interval input is reconsidered, with missing-manifest retries bounded to hourly when inputs stay unchanged."
  - "The 30-minute nominal head revisit is below the two-hour stale ceiling with 90 minutes of nominal margin; this is a scheduling target, not proof of runtime freshness."
  - "Actual market candle freshness, durable manifest presence, session creation, and learning remain UNVERIFIED until governed exact-main read-only runtime evidence exists."
