id: WO-RESEARCH-20261031-ROLLING-HOLDOUT-FOLDS
title: "K-of-N independent holdout folds: fold builder, decision rule and a per-fold runner composition (not wired)"
status: LOCAL_VALIDATED_PENDING_EXACT_HEAD_CI
created: 2026-10-31
trigger: "Host diagnosis on 2026-10-31 (running e1fd3ea93): candidateFunnel DISCOVERY_ONLY_REJECTED with experiments 18, discoveryPasses 15, holdoutPasses 0, overfitRatePercent 100. The single most-recent holdout rejects every discovery winner, and one holdout is also easy to pass or fail by chance. The owner approved N = 3, K = 2 (docs/PROPOSAL_RESEARCH_ROLLING_HOLDOUT.md)."
change:
  - "apps/cloud/src/researchWalkForwardWindows.ts: pure buildRollingFolds (N fully disjoint train/validation/holdout folds laid back to back, built with the existing buildWalkForwardWindows; any refusal refuses the whole set) and decideRollingHoldout (PASS only with at least K of exactly N fold outcomes CHALLENGER_BETTER; INSUFFICIENT never counts as a pass), colocated with the existing reachable walk-forward module."
  - "apps/cloud/src/researchExperimentRunner.ts: exported runRollingResearchExperiment composition runs the EXISTING runResearchExperiment once per fold (endCloseMs moved to each fold end), so each fold keeps its own windows, precommit, provenance and durable holdout claim. It is deliberately not called by the orchestrator, scheduler, ledger, backfill or /health. Every fold is built and checked before the first run, so a fold without history refuses the whole set with no claim made. A fold that could not be evaluated is INSUFFICIENT; a fold whose validation did not favour the challenger is NOT_BETTER and never claims its holdout."
  - "tests/research-rolling-runner.test.js: real SQLite candle store and holdout ledger with scripted evidence: two of three passes, one pass fails, validation-not-favourable never claims, short history makes no claim, a repeat run finds every holdout used and never passes, a failing port is a refusal."
  - "apps/cloud/src/researchRollingHoldout.test.ts: fold disjointness and ordering, whole-set refusal, and an exhaustive check over all 27 outcomes that every PASS has at least K individual passes; imports the helpers from the existing reachable module."
rules:
  - "Folds share no data: a fold's holdout never trains or validates another fold, so no information crosses folds. This needs N x (train + validation + holdout) of history (33 days with the 7/2/2 default), which the current 12-day backfill does not provide."
  - "K-of-N is never easier than one holdout: every PASS has at least K (>= 2) individual passes. A wrong number of outcomes or a value outside the three codes is INSUFFICIENT_EVIDENCE, never a pass."
not_changed:
  - "Nothing is wired: the runner, orchestrator, holdout claim ledger, precommit identity, dataset manifests, /health and the backfill are untouched. No pass rule, threshold, daily budget, risk limit or authority changes."
safety:
  paper_only: true
  liveAuthority: NONE
  productionMutationAllowed: false
  aiAuthority: ZERO_AUTHORITY
validation:
  - "Initial exact-head CI on e0b3f276 failed the cloud-unreached-baseline contract because the two new researchRolling* production modules were intentionally not wired. The same failure reproduced locally; no baseline relaxation was made."
  - "Moved the pure fold helpers into existing reachable researchWalkForwardWindows.ts and the uncalled composition into existing researchExperimentRunner.ts; no orchestrator, scheduler, ledger, backfill, /health, threshold, budget or authority wiring changed."
  - "Node 24.19.0 / pnpm 11.7.0 frozen-lockfile install; preflight, typecheck, build, 1322 isolated test files, full validate:full, security gate, lint (0 errors / 47 warnings), 15 focused reachability/rolling tests and git diff --check passed on the local repair worktree."
unverified: "Wiring into the orchestrator (which variants run, how a rolling PASS is counted as HOLDOUT_CHALLENGER_BETTER), the /health counters, and the backfill length and load (33+ days of 1-minute candles per market on the 4 vCPU / 8 GB host)."
next: "Commit this locally validated repair to the existing PR branch, keep the PR Draft, then obtain exact-successor CI and fresh independent review. Owner decision on the longer backfill (NUSA_RESEARCH_TRAIN_DAYS or a fold-aware target span) and on applying K-of-N to which bar lengths remains separate; the owner approved N = 3, K = 2 and a 33-day history on 2026-10-31. A separate work order is still required to wire runRollingResearchExperiment into the orchestrator and the longer backfill."
