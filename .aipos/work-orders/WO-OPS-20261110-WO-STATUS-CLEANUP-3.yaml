id: WO-OPS-20261110-WO-STATUS-CLEANUP-3
title: "Close 252 more work orders whose own branch has exactly one merged PR"
status: READY_FOR_REVIEW
created: 2026-11-10
authority_impact: none
trigger: "Follow-up of WO-OPS-20261109-WO-STATUS-CLEANUP-2. 383 work orders still read as not completed. Of those, the ones with an implementation_branch field were matched to closed PRs by head branch name."
method:
  - "Candidate: a non-completed work order with an implementation_branch, where that branch has exactly one PR on GitHub, that PR is merged, and no other work order names the same branch."
  - "Safety checks: 14 merge dates are one day before the date in the work order id (the id date is local KST); all are kept. 11 texts name other PR numbers but not the merged one; each was compared by hand (work order title against merged PR title). 10 match; WO-ISSUE-905 does not (issue number versus an unrelated PR) and was left untouched."
  - "114 work orders have no branch field and 15 had a reused or missing branch match; they were not changed."
change:
  - "Status -> COMPLETED and a closed_by_merge line (PR number, branch) on the matched work orders; CURRENT_TRUTH.md regenerated."
rules:
  - "Records only. closed_by_merge states that the PR merged; it does not claim a separate production verification."
not_changed:
  - "No code, workflow, threshold, limit, capital or authority."
safety:
  paper_only: true
  liveAuthority: NONE
  productionMutationAllowed: false
  aiAuthority: ZERO_AUTHORITY
validation:
  - "validate-aipos-yaml, aipos-work-order-status and aipos-current-truth tests."
correction:
  - "Follow-up: 27 of the 252 were restored to their previous status. Their old status was not a plain open/pending-CI spelling (VERIFYING, PARTIAL, RELEASE_GATE_PENDING, ROLLED_BACK, SUPERSEDED_BY_*, PLANNED, PROPOSED and similar). A merged PR does not prove those are complete; for example WO-0056 states it stays VERIFYING until deployment and connector evidence exist. Their closed_by_merge lines were removed with the restore."
