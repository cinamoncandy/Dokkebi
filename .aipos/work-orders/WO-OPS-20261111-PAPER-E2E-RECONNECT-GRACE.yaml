id: WO-OPS-20261111-PAPER-E2E-RECONNECT-GRACE
title: "actual-paper-runtime waits out a runner-side public-market reconnect before failing"
status: READY_FOR_REVIEW
created: 2026-11-11
implementation_branch: claude/paper-e2e-reconnect-grace
authority_impact: none
finding: "actual-paper-runtime failed on #3041, #3053 and #3070 (runs incl. 42834424111, 42935952276) with PAPER_RUNTIME_NOT_RUNNING, HALTED + KILL_SWITCH_ACTIVE, last_error PUBLIC_MARKET_RECONNECTING: the GitHub runner's public Upbit connection reconnected during observation. Each passed on one re-run; none of the PRs touched the runtime."
change:
