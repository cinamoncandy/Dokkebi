  - "A reconnect that does not resume fails closed exactly as before, with the diagnostic from when it began. Any other halt reason, error or state fails immediately."
  - "Evidence records transient_reconnect_episodes."
not_changed:
  - "Kill switch, risk, authority, minimum/maximum observation budget, decision-cycle requirement, event and fill validation."
