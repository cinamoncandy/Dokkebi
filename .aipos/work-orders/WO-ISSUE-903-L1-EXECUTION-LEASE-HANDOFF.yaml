id: WO-ISSUE-903-L1-EXECUTION-LEASE-HANDOFF
title: "Issue #903 close the scheduled producer to consumer lease handoff race"
status: IN_PROGRESS
priority: P0
owner: codex
repository: cinamoncandy/NUSA
issue: 903
pull_request: 2039
base_branch: main
base_commit: 54c095daff15bc4ef067e12ed26c666e5fd3d4c0
implementation_branch: agent/903-canonical-portfolio-autopilot
objective: "Preserve one durable execution lease across asynchronous producer-to-consumer handoff so a competing producer cannot reacquire while a consumer is running."
architecture_impact:
  acknowledged: true
  analysis: "Repairs the existing ExecutionCoordinator state machine; owner-approved scope now permits a narrowly scoped OIDC-authenticated Codex Claim/Release coordination path. No queue, scheduler, general coding worker, broad execution authority or production mutation is authorized."
  references:
    - apps/autopilot/src/executionCoordinator.ts
    - apps/autopilot/src/executionCoordinator.test.ts
    - apps/autopilot/src/causalDispatchCoordinator.test.ts
    - apps/autopilot/src/scheduledEvolutionCoding.attemptCap.test.ts
scope:
  - reject acquire while an unexpired HANDED_OFF execution lease is active
  - renew the same execution lease to the authenticated consumer's requested bounded expiry during LEASED to HANDED_OFF transition
  - enforce the logical active-WIP cap at two while safely reading and expiring persisted legacy state within the prior eight-claim storage bound
  - add a narrow GitHub Actions OIDC-only Codex claim/release route that reuses atomic active-WIP admission, validates the live run and exact selected main SHA, and requires explicit owner/conflict metadata
  - bind claims and releases to exact repository, workflow, protected ref, run, attempt, SHA, issue, execution identity, and current canonical task selection
  - bind claim admission to the exact selected issue snapshot that produced the Codex prompt, using a digest verified against a fresh server-side selection
  - recheck protected main after full task revalidation and immediately before atomic WIP admission
  - keep the Codex WIP claim lifecycle distinct from successful CodingRunner completion evidence
  - attempt idempotent claim release after every executed claim step, including ambiguous/lost responses
  - require the Codex job timeout to remain shorter than the existing active-WIP claim TTL and remove OIDC mint credentials from the Codex process environment
  - fetch a bounded, complete open-issue and open-PR inventory for both Codex selection and server-side claim revalidation; pagination/API ambiguity must fail closed
  - keep generic workflow failures fail-closed and unable to acquire a lease or dispatch without verified causal evidence
  - prove competing producer and duplicate consumer suppression using the existing coordinator
prohibited:
  - new_execution_state_or_queue
  - new_scheduler_or_consumer
  - lease_ttl_or_heartbeat_safety_weakening
  - broad_authority_expansion_or_unverified_oidc_claim_release
  - reactivating_or_dispatching_the_Codex_workflow_without_current_explicit_owner_approval
  - changing_repository_coding_variables_or_runner_configuration
  - deploying_the_Worker_or_mutating_production
  - production_or_broker_mutation
safety:
  liveAuthority: NONE
  productionMutationAllowed: false
  realOrderAuthority: false
  realTransferAuthority: false
  aiAuthority: ZERO_AUTHORITY
  paper_only: true
acceptance:
  - an unexpired HANDED_OFF record blocks another acquire for the same dedupe identity
  - consumer handoff persists the requested consumer execution expiry, not the shorter producer expiry
  - generic and causal-admission handoff paths both preserve the authenticated consumer lease expiry
  - callers cannot request more than two active WIP slots; pre-existing three-to-eight claim state remains readable, blocks new admission, and expires under the existing TTL
  - Codex claim accepts only the signed, allowlisted GitHub OIDC identity and GitHub API run record for the exact selected main SHA, workflow, run, and attempt, and rechecks current protected main before admission
  - missing/malformed/expired/forged/wrong-issuer/wrong-audience/wrong-workflow/wrong-ref/wrong-repository/wrong-SHA/stale-run claims fail closed
  - task selection is repeated server-side and requires explicit canonicalOwner and conflictKeys; linked/stale/unclaimable work is rejected
  - the local Codex selector and Worker claim revalidation use the same stable, bounded pagination; valid work beyond page one cannot be silently omitted and incomplete/duplicate/over-limit results cannot authorize a claim
  - the claim carries a digest of the exact selected issue prompt/owner/conflict snapshot; any changed snapshot is rejected before admission
  - protected main is rechecked after the selected-task snapshot is revalidated and immediately before atomic admission
  - the release client is invoked after every executed claim step, not only after its success output exists, so an ambiguous claim response gets an idempotent release attempt
  - concurrent/shared admission remains atomic and the combined coordinator never admits more than two active WIP claims
  - duplicate/replayed claim and wrong-run release are rejected; only the exact workflow run can release its slot
  - claim release is recorded as CLAIM_RELEASED, not successful coding completion, and cannot satisfy CodingRunner release-status evidence
  - the Codex process cannot mint OIDC tokens, and the full job timeout remains below the existing WIP lease expiry
  - generic workflow failures remain ABSTAINED without lease acquisition or dispatch
  - duplicate delivery remains fail-closed and does not replace the owner execution identity
  - expired leases retain existing bounded acquisition semantics
  - canonical transition remains LEASED -> HANDED_OFF -> RELEASED or DISPATCHED -> COMPLETED
  - focused coordinator and scheduled attempt-cap tests pass without weakening assertions
