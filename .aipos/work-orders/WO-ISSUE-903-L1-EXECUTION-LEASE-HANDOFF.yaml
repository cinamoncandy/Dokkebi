  - pnpm run preflight
  - node --test dist/apps/autopilot/src/codexWipCoordination.test.js dist/apps/autopilot/src/githubActionsOidc.test.js dist/apps/autopilot/src/activeWipRelease.test.js dist/apps/autopilot/src/executionCoordinator.test.js dist/apps/autopilot/src/causalDispatchCoordinator.test.js dist/apps/autopilot/src/scheduledEvolutionCoding.attemptCap.test.js dist/apps/autopilot/src/scheduledEvolutionCoding.test.js
