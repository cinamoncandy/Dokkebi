  - "Any runtime error arising after observation begins still ends that observation fail-closed."
  - "PAPER_RUNTIME_NOT_RUNNING evidence distinguishes known runtime states and halt reasons, scheduler true/false/UNKNOWN, and sanitized last-error codes; unknown values and secret-like text are not serialized."
