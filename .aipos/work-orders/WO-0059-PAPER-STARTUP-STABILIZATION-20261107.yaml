scope:
  - "Add a separate bounded pre-observation synchronization gate; do not change waitForAutomaticRuntime startup semantics or the runtime/orderbook reconciler."
  - "Permit waiting only for PAPER_ORDERBOOK_UNRECONCILED and PUBLIC_ORDERBOOK_SNAPSHOT_UNAVAILABLE, the exact locally-owned codes that runtime clears after fresh reconciled quotes for all configured markets."
  - "Require consecutive clean PAPER snapshots before starting the 60-180 second observation window."
  - "Retain bounded startup error count, first/last observation timestamps, and exact allowlisted codes in the artifact."
  - "Any writer lease, authority, malformed evidence, unknown error, or unrecovered synchronization error remains fail-closed."
  - "Keep PAPER readiness semantics and all execution authority unchanged."
acceptance:
  - "A recovered startup orderbook synchronization error is explicitly present in evidence, then observation begins only after consecutive clean snapshots."
  - "A persistent allowed synchronization error exhausts a finite startup budget, returns FAIL, and does not begin the observation clock."
  - "A writer lease or unknown runtime error fails immediately and cannot be reclassified as recoverable."
  - "Any runtime error arising after observation begins still ends that observation fail-closed."
  - "Natural no-order/no-fill/no-account-change observation remains semantically INCOMPLETE; no threshold or classifier changes."
  - "No synthetic ticker, signal, order, fill, or account mutation is introduced."
exclusions:
