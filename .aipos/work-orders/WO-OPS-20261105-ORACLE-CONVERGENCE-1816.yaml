id: WO-OPS-20261105-ORACLE-CONVERGENCE-1816
title: "Bind Deployment Convergence to exact Oracle Release and host read-back evidence"
status: IN_PROGRESS
owner: nusa-development
repository: cinamoncandy/NUSA
base_branch: main
base_commit: 185c52c22691a5a35b13fe024cb39d810719a833
branch: fix/oracle-convergence-host-evidence-1816
issues: [1816]
authority_impact: deployment-evidence-only; no release, runtime, or execution authority change
objective: "Prevent the deployment watchdog and machine-readable receipt from treating an absent or stale Oracle Release as converged; bind the Oracle result to a successful exact-main Release attempt and a later read-only host observation of /opt/nusa/current."
root_cause: "The Watchdog dispatched the global receipt without checking Oracle PAPER Release. The Receipt treated any successful Release run on the requested head as sufficient and did not include a server-verified post-release Oracle host SHA, run attempt, artifact identity, or host identity."
scope:
  - "The watchdog gates receipt dispatch on the latest exact-main Oracle PAPER Release success and a later successful read-only Oracle Host Diagnose; it never dispatches a Release or Host Diagnose."
  - "The receipt verifier reads GitHub run, attempt-specific job, artifact, and job-log evidence using existing actions:read and contents:read permissions."
  - "Require the successful Release run, protected-main source SHA, release artifact identity, deployed currentRelease read-back, and later host Diagnose /opt/nusa/current read-back to agree. Require the same self-hosted runner identity for Release and Diagnose."
  - "Keep source approval provenance RELEASE_PROVENANCE_UNKNOWN unless its separate approval chain is actually reconstructed."
  - "Add regression coverage for missing/active/failed Release, stale or absent host SHA, pre-release diagnosis, mismatched run/attempt/artifact/host, and main movement."
exclusions:
  - "No Oracle Release dispatch, deployment, restart, host mutation, new host permissions, LIVE authority, real order/transfer authority, or change to Risk/readiness/lease policy."
  - "No client-provided Oracle SHA is accepted as trusted host evidence."
  - "This change does not claim independent review, Formal Validator, Audit, Release authorization, merge, or post-change Oracle convergence."
acceptance:
  - "The latest exact-main Oracle PAPER Release must be completed/successful with a valid current-attempt release job and an artifact id/digest tied to that run and SHA."
  - "A successful Oracle Host Diagnose started after that Release must be exact-main, read-only, run on the same identified self-hosted runner, and log the actual /opt/nusa/current resolved release path and observation timestamp."
  - "Protected main == Release head/deployed currentRelease == Host Diagnose observed SHA is required for oracle_convergence_status=CONVERGED."
  - "Missing, malformed, stale, failed, active, cross-attempt, cross-host, cross-artifact, API-unavailable, or changed-main evidence stays INCOMPLETE."
  - "The receipt keeps RELEASE_PROVENANCE_UNKNOWN and all PAPER_ONLY/ZERO_AUTHORITY invariants."
  - "Exact-head CI and fresh independent validation precede any governed inclusion; post-change Oracle convergence remains a separate later evidence step."
verification_commands:
  - "node --test tests/deployment-convergence-oracle.test.js tests/deployment-rollback-governance.test.js tests/release-convergence-orthogonality.test.js"
  - "node scripts/validate-workflow-action-inputs.js"
  - "node scripts/validate-workflow-action-pins.js"
  - "node scripts/validate-workflow-authority-map.js"
  - "pnpm run validate:full"
  - "pnpm run typecheck"
  - "pnpm run build"
  - "pnpm run security:gate"
  - "pnpm run lint:scripts"
  - "git diff --check"
