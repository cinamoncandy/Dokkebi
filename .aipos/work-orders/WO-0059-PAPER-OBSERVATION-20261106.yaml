objective: "Extend the existing WO-0059 public-market PAPER evidence harness with a bounded observation window that records several natural decision cycles and the observed Decision-to-Risk-to-execution evidence without treating missing outcomes as success."
scope:
  - "Keep waitForAutomaticRuntime() as the startup check and add a separate explicit bounded observation window."
  - "Observe for at least 60 seconds and at most 180 seconds, polling the existing read-only PAPER operations projection, and require at least three distinct natural Decision cycle identities for a complete observation window."
  - "Do not stop early because no order or fill exists; record actual elapsed time and a stable stop reason."
  - "Record sanitized event-time/status/reason-code evidence for MARKET_DATA, SIGNAL, DECISION, RISK, PAPER_ORDER, PAPER_FILL, and ACCOUNT/PNL; mark absent stages NOT_OBSERVED or UNKNOWN."
  - "Treat runtime errors, lease conflicts, malformed observations, and authority invariant violations as fail-closed evidence."
  - "Retain restart/replay duplicate-fill checks and the existing semantic readiness classifier unchanged."
acceptance:
  - "Ticker/startup readiness does not end the observation window before its minimum duration."
  - "At least three distinct natural Decision cycle IDs are collected when available; reaching the finite maximum without them is INCOMPLETE."
  - "A completed observation with no natural order/fill/account change remains INCOMPLETE for autonomous PAPER certification."
  - "Risk rejection preserves only the existing bounded reason code; raw detail, secrets, account identity, and private credentials are never emitted."
  - "Restart/replay keeps duplicate-fill rejection, and a writer-lease/runtime failure ends observation fail-closed while retaining bounded failure evidence."
  - "No signal or order is synthesized, and readiness certification thresholds or runtime authority are not changed."
exclusions:
  - "No changes to the canonical Cloud runtime, risk policy, writer lease, scheduler, or order path."
  - "No changes to Research interval collection or manifests in PR #3002."
  - "No change to PR #2996 readiness callback or its branch."
  - "No production deployment, restart, database mutation, LIVE activation, real order, withdrawal, or transfer."
architecture_impact:
  acknowledged: true
  analysis: "This is an evidence-harness-only addition over the existing local canonical Cloud PAPER runtime and its read-only operations projection. Startup readiness remains separate from observation completion. It introduces no runtime component, writer, execution path, scheduler, risk policy, or authority and does not satisfy WO-0051's human/environment gate."
