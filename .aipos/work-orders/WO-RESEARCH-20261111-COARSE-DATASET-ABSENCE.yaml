id: WO-RESEARCH-20261111-COARSE-DATASET-ABSENCE
title: "15m/60m research datasets accept only exchange-proven 1m absences"
status: READY_FOR_REVIEW
created: 2026-11-11
implementation_branch: claude/coarse-dataset-confirmed-absence
authority_impact: none
finding: "15m/60m research manifests have been refused since the 2026-11-08 exchange gap (17:01-22:00 UTC, 299 minutes with no candle, proven by the exchange). The materializer allowed exchange-confirmed absences only on the 1m series, so no 15m/60m candidate could be supplied to the learning loop."
change:
  - "For a 15m/60m series, every missing 1m close inside its span must be covered by a recorded exchange-confirmed absence run (listAbsence). One unconfirmed missing minute still throws 'canonical dataset has missing intervals'."
  - "Review P1 fix: the tolerance applies only to 900000 (15m) and 3600000 (60m); every other interval keeps the old refusal."
  - "expectedBaseCount subtracts the confirmed missing minutes; the gapped manifest keeps the ALLOW policy, the absence evidence fingerprints and the non-contiguous quality identity."
not_changed:
  - "1m behavior, gap-free dataset identity, study rules, thresholds, holdout, risk, execution, authority. Our own data loss is never accepted."
safety:
  paper_only: true
  liveAuthority: NONE
  productionMutationAllowed: false
  aiAuthority: ZERO_AUTHORITY
validation:
  - "research-candle-material 10/10 (new 15m test: unconfirmed refused, confirmed accepted, one extra unconfirmed minute refused), research-experiment-pipeline and research-experiment-composition pass."
review: "Research-integrity code: draft until a non-author review."
next_action: "Independent review, merge, release; then rebuild the 15m/60m manifests."
