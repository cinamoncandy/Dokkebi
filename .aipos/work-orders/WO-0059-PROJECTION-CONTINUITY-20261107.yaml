  - "Validate unique event IDs and descending timestamp / ascending equal-timestamp ID order per canonical read-only projection."
  - "When a window is saturated, require the prior window's newest event ID to remain present to anchor newly emitted events; older shared IDs alone do not establish continuity."
  - "Preserve EVENT_EVIDENCE_TRUNCATED/INCOMPLETE on missing newest anchor, invalid order, duplicated IDs, or bounded collector overflow."
  - "Record counts and ORDERED_PROJECTION_WINDOWS_ONLY proof scope without recording raw IDs or confidential details."
  - "Keep visible ERROR/HALT failures fail-closed and bounded risk reason codes; upstream omission of unrecorded critical events remains UNVERIFIED."
acceptance:
  - "Saturated adjacent newest-first 250-event projections with valid unique IDs and a retained newest anchor may complete observation after the existing 60s and three natural Decision cycle requirements."
  - "Saturated projection with overlap but a lost newest anchor, duplicate IDs, or inverted timestamps is INCOMPLETE."
  - "Absent genuine Decision cycles remains INCOMPLETE even if windows overlap."
  - "Any visible HALT/ERROR FAIL still fails closed."
  - "Autonomous order/fill/PnL absence remains readiness INCOMPLETE, independent of observer status."
  - "Upstream source omission and missing-event count remain UNKNOWN; no certification is inferred from projection continuity alone."
exclusions:
  - "No changes to the canonical runtime recorder, 250-event projection cap, 5000-event collector cap, market selector, Risk, writer lease, order/fill or readiness classifier."
  - "No modification to #3005 Canary, #2996 callback, #3002 Research, merged #3006, protected main, deployed Oracle, or LIVE authority."
