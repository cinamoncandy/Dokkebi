objective: "Keep bounded natural PAPER observation from being marked truncated solely because a valid 250-event newest-first projection is full, fail closed on detectable window gaps, explicitly retain UNKNOWN for uncovered late/backdated events, and do not relax semantic readiness."
scope:
  - "Only the existing scripts/actual-paper-runtime-e2e.js observer and its regression tests."
  - "Validate unique event IDs and descending timestamp / ascending equal-timestamp ID order per canonical read-only projection."
  - "When a window is saturated, require the prior window's newest event ID to remain present; report this only as an adjacent-window anchor check, not insertion-order or source completeness."
  - "Preserve EVENT_EVIDENCE_TRUNCATED/INCOMPLETE on missing newest anchor, invalid order, duplicated IDs, or bounded collector overflow."
  - "Record capped-window anchor counts, ADJACENT_WINDOW_ANCHORS_ONLY proof scope, and late_backdated_event_coverage=UNKNOWN without recording raw IDs or confidential details."
  - "Keep visible ERROR/HALT failures fail-closed and bounded risk reason codes; upstream omission of unrecorded critical events remains UNKNOWN."
acceptance:
  - "Saturated adjacent newest-first 250-event projections with valid unique IDs and a retained newest anchor may complete the observation window after the existing 60s and three natural Decision cycle requirements."
  - "Saturated projection with a lost newest anchor, duplicate IDs, or inverted timestamps is INCOMPLETE."
  - "The anchor metric must not imply insertion-order completeness, full event continuity, or autonomous execution readiness; late/backdated event coverage remains UNKNOWN."
  - "Absent genuine Decision cycles remains INCOMPLETE even when window anchors are verified."
  - "Any visible HALT/ERROR FAIL still fails closed."
  - "Autonomous order/fill/PnL absence remains readiness INCOMPLETE, independent of observer status."
  - "Upstream source omission and missing-event count remain UNKNOWN; no certification is inferred from projection continuity alone."
  - "A late event backdated below the top-250 cutoff is not detectable; adjacent-window anchoring does not prove insertion order. Without upstream sequence proof, this case is UNKNOWN."
  - "The adjacent_windows_anchored output is true only for a valid moving saturated window anchored by the prior newest ID, not a static window."
exclusions:
  - "No changes to the canonical runtime recorder, 250-event projection cap, 5000-event collector cap, market selector, Risk, writer lease, order/fill or readiness classifier."
  - "No modification to #3005 Canary, #2996 callback, #3002 Research, merged #3006, protected main, deployed Oracle, or LIVE authority."
architecture_impact:
  acknowledged: true
  analysis: "Conservative change to a read-only evidence consumer. The recorder sorts and prunes by occurredAt and has no insertion-order timestamp guarantee, so late/backdated-event coverage remains UNKNOWN. Adjacent window anchors are not an audit of source completeness or proof of autonomous trading."
