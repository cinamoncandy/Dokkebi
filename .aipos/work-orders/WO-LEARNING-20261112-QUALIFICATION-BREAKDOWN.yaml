review_20261112: "Independent review ACCEPT WITH P2. P2 fixed: the tracker skipped bad code entries one by one and published the rest, while the /health allow-list drops the whole map; the tracker now drops the whole map too (one bad code or count, more than eight codes, an array, or an empty map), keeping the integer counts. The test now pins a mixed map, a clean map and six unusable maps at the tracker."
