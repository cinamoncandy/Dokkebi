finding: "2026-11-12 17:15 KST after release 9ebbcbb6e: bootstrapReasons=[ALLOCATION_NO_ALLOCATABLE_CANDIDATES, NO_ALLOCATION_ADVISORY]. No candidate passes the allocation conditions (eligible, QUALIFIED_FOR_LEAGUE, evidence breadth >= 0.5), so candidate supply, not the single-entry rule, is what blocks LL1. Which qualification gate stops the candidates (PBO, cost stress, parameter, economic edge, missing hypothesis, evidence breadth, OOS provenance) is persisted in the replay result but not published. This is the first step of LL2 (failure-cause classification) in docs/LEARNING_LOOP_LEVELS_20261112.md."
change:
  - "closedLearningInitialPaperBootstrap.ts: summarizeQualification builds counts from qualification.coverage and, for candidates that are not QUALIFIED_FOR_LEAGUE, the number of candidates carrying each fixed upper-case reason code (each code once per candidate, at most eight codes, highest count first). It is attached to the RESEARCH_NOT_DEPLOYABLE result only."
  - "closedLearningLoopStatus.ts: the tracker keeps bootstrapQualification (four integers) and bootstrapRejectionReasons (code -> count) only while bootstrap is RESEARCH_NOT_DEPLOYABLE, rebuilt in publish() from the current bootstrap (no stale carry-over)."
  - "server.ts publicRuntimeLiveness: independent allow-list. Counts must be safe integers 0..1000000; a bad count withdraws both fields; a code map passes only with 1..8 entries, every key matching ^[A-Z][A-Z0-9_]{2,63}$ and every value a safe integer; one bad entry drops the whole map. Types widened for the nested objects."
