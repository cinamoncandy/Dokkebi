id: WO-OPS-20261021-RELEASE-DOWNSTREAM-DISPATCH
title: "Keep deterministic Release green when an optional downstream workflow is intentionally disabled"
status: RELEASE_GATE_PENDING
owner: nusa-server-automation
repository: cinamoncandy/NUSA
issue: 2843
base_branch: main
base_commit: 55d723aada9dfcdb78293bbef30c3af2a6ac26f2
