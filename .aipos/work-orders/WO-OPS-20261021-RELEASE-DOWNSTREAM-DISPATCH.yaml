implementation_branch: WO-OPS-20261021-RELEASE-DOWNSTREAM-DISPATCH
authority_impact: deployment-control
finding: "Deterministic Audit/Release run 39469748838 canonically merged PR #2818 and recovered exact-main CI, then failed only because its post-merge downstream step unconditionally workflow_dispatch'ed android-stable-release-trigger.yml while that workflow was intentionally disabled_manually; GitHub returned HTTP 422."
first_broken_transition: "post-merge exact-main CI SUCCESS -> downstream workflow dispatch"
root_cause: "The existing deterministic Release step assumes every optional downstream workflow is active and dispatchable. It does not read workflow state or suppress a duplicate exact-main run before dispatch."
scope:
  - "Reuse the existing Autopilot Deterministic Audit Release workflow; do not add a second release engine or scheduler."
  - "Read each downstream workflow's GitHub Actions state before workflow_dispatch."
  - "Treat disabled_manually as an explicit skip only for the allowlisted optional Android stable trigger; required downstreams remain fail-closed, and no workflow is enabled automatically."
  - "For active workflows, suppress duplicate dispatch when an exact-main queued/in-progress/success run already owns convergence."
  - "A successful workflow_run wrapper with its guarded applicable job skipped is not an owner; require the named workflow job itself to be active or completed successfully."
  - "Fail closed on unexpected workflow states or API-read failure."
  - "Add focused regression coverage for disabled-manually and duplicate-suppression behavior."
  - "android-stable-release-trigger.yml and android-stable-release-watchdog.yml also read the android-stable-release.yml state before dispatch: disabled_manually exits 0 with a notice, any other non-active state (including disabled_inactivity) fails with an error."
  - "Known liveness gap (not a safety gap): a queued or in-progress same-SHA run that later fails has still suppressed this dispatch; Android recovers through the 5-minute trigger and watchdog, wo-0059-actual-paper-runtime and Windows have no retry from this step."
acceptance:
  - "Focused deterministic Audit/Release tests pass."
  - "Workflow YAML parses."
  - "git diff --check passes."
  - "Exact-head CI and required companion workflows pass."
  - "Fresh non-author Validator reports zero actionable P0/P1/P2 findings."
  - "Governed Audit/Release merges only through existing nusa/release-authorized authority."
