id: WO-AUTOPILOT-20261030-1851-CAUSAL-ADMISSION
title: Bind publisher and source evidence before autonomous coding admission
status: IN_PROGRESS
owner: nusa-development
issue: 1851
repository: cinamoncandy/NUSA
base_branch: main
base_commit_observed: 1a8bb3b261f8e4ac242499a93287da6c370ed4b3
authority_impact: fail_closed_autopilot_coding_admission
problem: "A workflow failure is not causal code evidence; a trusted publisher and a verified source run must also have a server-authenticated relationship before causal evidence can authorize coding."
scope:
  - Reuse existing GitHub Actions OIDC verification, ExecutionCoordinator, coding runner and EVOLVE admission.
  - Bind distinct publisher and source run identities with server-retained dispatch provenance and reject replay or unknown relationships.
  - Admit CODE_ACTIONABLE only with trusted provenance and a deterministic repository-owned causal regression contract.
  - Preserve legacy static-token uses while denying static-token-only causal authority.
out_of_scope:
  - New scheduler, queue, execution engine, independent governance engine, or LIVE authority.
  - Oracle mutation, real orders or transfers, safety or risk relaxation, and fabricated evidence.
recovery:
  previous_partial: /workspace/nusa-1851-actionability
  current_worktree: /workspace/nusa-1851-latest
  preserved_patch: /workspace/evidence/1851-oidc-pre-reconvergence-20261030.patch
  prior_pr: 1854_CLOSED_DO_NOT_REVIVE
  current_open_implementation_pr: NONE_FOUND
  verified_local_partial: "Signed OIDC publisher identity, separate GitHub run cross-checks, atomic coordinator binding with bounded unclaimed retries, selected-opportunity/run/SHA agreement, scheduled lease SHA, dispatch artifact capability redaction, and a fixed truth-table observation prototype exist locally. Focused OIDC/binding/coordinator/bridge/scheduled/CodingRunner/observation tests 168/168, sanitizer tests 2/2, and typecheck pass. Optional dispatch capability issuance and OIDC-only Worker claim are locally connected and tested; the scheduled admission path is not wired to them and nothing grants causal admission."
  remaining_binding_limits:
    - "Unclaimed capability rotation across bounded acquisition generations is tested. A claimed generation cannot be replaced until durable causal receipt deduplication and retry semantics are established."
    - "Dispatch artifact sanitizer excludes causal_dispatch_capability locally; delivery and all remaining log/artifact paths are not yet wired or verified."
    - "Bridge now abstains when the selected workflow opportunity's run or SHA differs from the request; exact source attempt still requires independent GitHub verification at registration."
    - "The fixed truth-table observer produces only a local observation; it is not an authenticated causal receipt or proof of why a CI run failed."
acceptance:
  - Exact publisher/source repository, workflow, SHA, run and relevant attempt identities are server-verified and tied by a durable, replay-resistant authorized relationship.
  - Unknown, malformed, unavailable or mismatched provenance fails closed; static token alone never grants causal authority.
  - A deterministic repository-owned regression producer and verifier provide a positive path through existing CodingRunner without using generic CI failure as proof.
  - Relevant adversarial, scheduled and CodingRunner regressions, build, typecheck, lint and security gates pass before a commit or PR.
next: "Complete claimed-generation retry and receipt deduplication, connect a trusted source-run-bound causal producer/verifier and authenticated capability delivery, then gate all failure-based admission and publish paths without widening authority."
safety: PAPER_ONLY_LIVE_NONE_PRODUCTION_MUTATION_FALSE_REAL_ORDER_FALSE_REAL_TRANSFER_FALSE_AI_ZERO_AUTHORITY

