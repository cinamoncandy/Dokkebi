producer_contract_candidate_v1:
  status: DESIGN_CANDIDATE_NOT_IMPLEMENTED_OR_APPROVED
  purpose: "Attest a deterministic reproducer result for a protected-main source run; original CI failure is only a trigger."
  allowed_producer:
    repository: cinamoncandy/NUSA
    workflow_path: .github/workflows/ci.yml
    workflow_ref: refs/heads/main
    event: push
    source_sha_rule: "source SHA must equal the producer run head SHA; no client-selected alternate SHA"
    job_name: causal-regression-contract
    required_permissions:
      contents: read
      id-token: write
      attestations: write
    forbidden_permissions: "contents: write, pull-requests: write, actions: write, deployments: write"
  reproducibility:
    checkout: "exact producer head SHA; persist-credentials=false"
    predicate: "REPAIRABLE_WORKFLOW_POLICY_V1 loaded from the exact protected-main checkout"
    repetitions: 2
    positive_rule: "both executions must produce the same explicit OBSERVED_MISMATCH for the same fixed case and fingerprint"
    control_rule: "fixed expected truth table is embedded in the protected contract; changes require an explicit contract version bump and fresh independent validation"
    external_dependency: "none permitted in predicate execution"
    limit: "This establishes a regression in the protected repository policy predicate only; it does not prove an arbitrary CI failure was caused by that predicate. Admission scope must remain limited to that predicate's repair class."
  manifest:
    subject: "canonical deterministic JSON bytes; digest is SHA-256 of exact bytes"
    identities: "repository, source SHA/workflow/run/attempt, producer workflow/ref/SHA/run/attempt/job, predicate id/version, observations, stable failure fingerprint"
    secret_policy: "no bearer token, OIDC token, dispatch capability or credential in manifest or logs"
  server_verification:
    - "Fetch source and producer workflow runs and exact attempts from GitHub; require completed state and exact repository/path/ref/SHA/event/run/attempt match."
    - "Fetch producer jobs; require exactly one allowlisted causal-regression-contract job with success and matching producer run id."
    - "Fetch the artifact by exact producer run; verify artifact digest and exact subject bytes."
    - "Verify GitHub cryptographic artifact provenance/attestation for the manifest subject, expected repository and protected producer workflow identity; unknown/unsupported bundle fails closed."
    - "Recompute manifest digest, predicate fingerprint and result consistency; reject client assertions as authority."
    - "Require source run identity to equal the attested producer source identity; source run status/conclusion is trigger metadata only."
  receipt_replay_key: "repository|source_sha|source_workflow|source_run_id|source_attempt|producer_workflow|producer_sha|producer_run_id|producer_attempt|producer_job_id|predicate_id|predicate_version|manifest_digest|failure_fingerprint"
  admission_rule: "Only the server may mint a one-time durable receipt with classification REPOSITORY_CODE_REGRESSION after all verification succeeds; otherwise EVIDENCE_INSUFFICIENT. Generic workflow failure, publisher OIDC or artifact metadata never suffice."
  implementation_blockers:
    - "Confirm GitHub artifact attestation support, API/bundle format, and minimal permission availability in this repository plan/runtime."
    - "Current producer observes a policy predicate mismatch but has no source-run/job causal binding; it is not positive evidence."
    - "Current producer job is defined in the same CI workflow and local dirty source; no deployed or protected-main producer identity exists yet."

