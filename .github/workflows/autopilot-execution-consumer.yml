name: Autopilot Execution Consumer

on:
  repository_dispatch:
    types: [nusa_autopilot_execution]

permissions: {}

concurrency:
  group: autopilot-execution-${{ github.event.client_payload.dedupe_key }}
  cancel-in-progress: false

jobs:
  consume:
    # A repository_dispatch can arrive after main advances; stale requests are intentionally skipped.
    # Autopilot coding is off unless the repository variable NUSA_AUTOPILOT_CODING_ENABLED is 'true'
    # (owner decision 2026-10-13: the Workers AI engine merged 1 of 12 attempts and none in two weeks,
    # while keeping it running cost more than it produced). Audit and Release do not use this job.
    if: ${{ github.event.client_payload.kind == 'REPOSITORY_AUTOPILOT' && vars.NUSA_AUTOPILOT_CODING_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Checkout exact requested SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.client_payload.head_sha }}
          fetch-depth: 1

      - name: Persist dispatch event
        run: |
          mkdir -p artifacts/autopilot-execution
          node scripts/sanitize-autopilot-dispatch.js "$GITHUB_EVENT_PATH" artifacts/autopilot-execution/repository-dispatch.json

      - name: Validate fail-closed execution payload
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const payload = event.client_payload || {};
          const fail = (message) => { console.error(message); process.exit(1); };
          if (payload.kind !== 'REPOSITORY_AUTOPILOT') fail(`unexpected kind: ${payload.kind}`);
          if (payload.repository !== process.env.GITHUB_REPOSITORY) fail(`repository mismatch: ${payload.repository}`);
          if (!/^[0-9a-f]{40}$/i.test(payload.head_sha || '')) fail('head_sha must be an exact 40-character commit SHA');
          if (!Number.isSafeInteger(payload.workflow_run_id) || payload.workflow_run_id <= 0) fail('workflow_run_id must be a positive safe integer');
          if (!/^[A-Za-z0-9_.:-]{1,160}$/.test(payload.execution_id || '')) fail('execution_id must be a bounded lifecycle identity');
          if (!/^[A-Za-z0-9_.:-]{1,256}$/.test(payload.dedupe_key || '')) fail('dedupe_key must be a bounded lifecycle identity');
          if (payload.contract_fingerprint_sha256 != null && !/^[0-9a-f]{64}$/i.test(payload.contract_fingerprint_sha256)) fail('contract_fingerprint_sha256 must be a SHA-256 identity');
          if (payload.live_authority !== 'NONE') fail('live_authority must remain NONE');
          if (payload.production_mutation_allowed !== false) fail('production_mutation_allowed must remain false');
          if (payload.ai_authority !== 'ZERO_AUTHORITY') fail('ai_authority must remain ZERO_AUTHORITY');
          NODE

      - name: Verify checkout and current main identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          requested='${{ github.event.client_payload.head_sha }}'
          test "$(git rev-parse HEAD)" = "$requested"
          current="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          test "$current" = "$requested" || { echo "stale main: requested=$requested current=$current"; exit 1; }

      - name: Download same-source-run causal attestation when present
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.client_payload.workflow_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ github.event.client_payload.causal_source_run_attempt }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/autopilot-execution/causal-attestation
          if [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]{0,19}$ && "$SOURCE_RUN_ATTEMPT" =~ ^[1-9][0-9]{0,9}$ ]]; then
            if gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
              --name "nusa-causal-attestation-${SOURCE_RUN_ATTEMPT}" \
              --dir artifacts/autopilot-execution/causal-attestation 2>/dev/null; then
              test -s artifacts/autopilot-execution/causal-attestation/attestation.json
            else
              echo 'No same-run causal attestation artifact; provenance-only claim remains non-authoritative.'
            fi
          else
            echo 'No valid source attempt identity; no causal attestation can be supplied.'
          fi

      - name: Suppress stale failure-repair dispatch
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_REASON: ${{ github.event.client_payload.reason }}
          DISPATCH_RUN_ID: ${{ github.event.client_payload.workflow_run_id }}
        run: |
          set -euo pipefail
          # A completed run keeps its failure conclusion forever, so the cited run alone cannot
          # reveal that the same workflow already recovered on the same head. Fetch the runs of
          # that workflow for the exact head so a strictly newer success can suppress a repair
          # nobody needs. A failed or empty listing degrades to the cited-run-only decision.
          if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DISPATCH_RUN_ID" > artifacts/autopilot-execution/cited-run.json 2>/dev/null; then
            cited_workflow_id="$(jq -r '.workflow_id // empty' artifacts/autopilot-execution/cited-run.json)"
            cited_head_sha="$(jq -r '.head_sha // empty' artifacts/autopilot-execution/cited-run.json)"
            successors=""
            if [ -n "$cited_workflow_id" ] && [ -n "$cited_head_sha" ]; then
              if gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$cited_workflow_id/runs?head_sha=$cited_head_sha&per_page=100" > artifacts/autopilot-execution/cited-workflow-runs.json 2>/dev/null; then
                successors="artifacts/autopilot-execution/cited-workflow-runs.json"
              fi
            fi
            if [ -n "$successors" ]; then
              node scripts/verify-dispatch-run-freshness.js --reason "$DISPATCH_REASON" --run artifacts/autopilot-execution/cited-run.json --successors "$successors" --out artifacts/autopilot-execution/dispatch-freshness.json | tee -a "$GITHUB_OUTPUT"
            else
              node scripts/verify-dispatch-run-freshness.js --reason "$DISPATCH_REASON" --run artifacts/autopilot-execution/cited-run.json --out artifacts/autopilot-execution/dispatch-freshness.json | tee -a "$GITHUB_OUTPUT"
            fi
          else
            echo "run fetch failed; deferring to worker verification"
            echo "repair=true" | tee -a "$GITHUB_OUTPUT"
          fi

      - name: Build coding runner request
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const payload = event.client_payload || {};
          const request = {
            kind: payload.kind,
            repository: payload.repository,
            headSha: payload.head_sha,
            workflowRunId: payload.workflow_run_id,
            reason: payload.reason,
            executionId: payload.execution_id,
            dedupeKey: payload.dedupe_key,
            ...(payload.contract_fingerprint_sha256 ? { contractFingerprintSha256: String(payload.contract_fingerprint_sha256).toLowerCase() } : {}),
            mutationAllowed: false,
            liveAuthority: 'NONE',
            productionMutationAllowed: false,
            aiAuthority: 'ZERO_AUTHORITY',
          };
          fs.writeFileSync('artifacts/autopilot-execution/coding-runner-request.json', JSON.stringify(request, null, 2));
          NODE

      - name: Claim causal dispatch provenance
        run: node scripts/autopilot-causal-claim.js

      - name: Select supported coding backend
        id: backend
        env:
          NUSA_CODING_RUNNER_URL: https://nusa-autopilot.desporin12.workers.dev/coding/execute
        run: |
          if [ -n "${NUSA_CODING_RUNNER_URL:-}" ]; then
            echo 'mode=external' >> "$GITHUB_OUTPUT"
          else
            echo 'mode=observe-only' >> "$GITHUB_OUTPUT"
          fi

      - name: Record unavailable coding backend
        if: ${{ steps.backend.outputs.mode == 'observe-only' }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const request = JSON.parse(fs.readFileSync('artifacts/autopilot-execution/coding-runner-request.json', 'utf8'));
          fs.writeFileSync('artifacts/autopilot-execution/coding-runner-result.json', JSON.stringify({
            status: 'NO_ACTION',
            reason: 'supported-external-coding-runner-not-configured',
            request,
          }, null, 2));
          NODE

      - name: Record stale repair suppression
        if: ${{ steps.freshness.outputs.repair == 'false' }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const request = JSON.parse(fs.readFileSync('artifacts/autopilot-execution/coding-runner-request.json', 'utf8'));
          const freshness = JSON.parse(fs.readFileSync('artifacts/autopilot-execution/dispatch-freshness.json', 'utf8'));
          fs.writeFileSync('artifacts/autopilot-execution/coding-runner-result.json', JSON.stringify({
            status: 'NO_ACTION',
            reason: `stale-failure-repair-suppressed:${freshness.reason}`,
            request,
          }, null, 2));
          NODE

      - name: Dispatch to configured external coding runner with bounded retry
        if: ${{ steps.backend.outputs.mode == 'external' && steps.freshness.outputs.repair != 'false' }}
        env:
          NUSA_CODING_RUNNER_URL: https://nusa-autopilot.desporin12.workers.dev/coding/execute
        run: node scripts/autopilot-dispatch-retry.js

      - name: Classify execution boundary
        if: always()
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = 'artifacts/autopilot-execution/coding-runner-result.json';
          const result = fs.existsSync(path) ? JSON.parse(fs.readFileSync(path, 'utf8')) : { status: 'FAILED_CLOSED' };
          console.log(`executor=${result.status}`);
          console.log('liveAuthority=NONE');
          console.log('productionMutationAllowed=false');
          console.log('AI authority=ZERO_AUTHORITY');
          NODE

      - name: Upload execution artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: autopilot-execution-${{ github.run_id }}
          path: artifacts/autopilot-execution

  audit-request:
    # Every AUDIT_REQUEST executes the OIDC-authenticated independent Audit. PR comments are observability only.
    if: ${{ github.event.client_payload.kind == 'AUDIT_REQUEST' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
      pull-requests: write
      id-token: write
    outputs:
      authority: ${{ steps.audit-authority.outputs.authority }}
      applicable: ${{ steps.freshness.outputs.applicable }}
      failure_class: ${{ steps.classify-audit.outputs.failure_class }}
      recovery: ${{ steps.classify-audit.outputs.recovery }}
    steps:
      - name: Persist audit dispatch evidence
        run: |
          mkdir -p artifacts/autopilot-audit-request
          cat "$GITHUB_EVENT_PATH" > artifacts/autopilot-audit-request/repository-dispatch.json

      - name: Validate fail-closed audit payload
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const payload = event.client_payload || {};
          const fail = (message) => { console.error(message); process.exit(1); };
          if (payload.kind !== 'AUDIT_REQUEST') fail(`unexpected kind: ${payload.kind}`);
          if (payload.repository !== process.env.GITHUB_REPOSITORY) fail(`repository mismatch: ${payload.repository}`);
          if (!Number.isSafeInteger(payload.pr_number) || payload.pr_number <= 0) fail('pr_number must be a positive safe integer');
          if (!/^[0-9a-f]{40}$/i.test(payload.head_sha || '')) fail('head_sha must be an exact 40-character commit SHA');
          if (!Number.isSafeInteger(payload.workflow_run_id) || payload.workflow_run_id <= 0) fail('workflow_run_id must be a positive safe integer');
          if (!/^[A-Za-z0-9_.:-]{1,160}$/.test(payload.execution_id || '')) fail('execution_id must be a bounded lifecycle identity');
          if (!/^[A-Za-z0-9_.:-]{1,256}$/.test(payload.dedupe_key || '')) fail('dedupe_key must be a bounded lifecycle identity');
          if (payload.audit_retry_attempt != null && (!Number.isSafeInteger(payload.audit_retry_attempt) || ![0, 1].includes(payload.audit_retry_attempt))) fail('audit_retry_attempt must be 0 or 1 when present');
          if (payload.live_authority !== 'NONE') fail('live_authority must remain NONE');
          if (payload.production_mutation_allowed !== false) fail('production_mutation_allowed must remain false');
          if (payload.ai_authority !== 'ZERO_AUTHORITY') fail('ai_authority must remain ZERO_AUTHORITY');
          NODE

      - name: Resolve Audit request freshness
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.client_payload.pr_number }}
          REQUESTED_HEAD: ${{ github.event.client_payload.head_sha }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > artifacts/autopilot-audit-request/pull-freshness.json
          PR_NUMBER="$PR_NUMBER" REQUESTED_HEAD="$REQUESTED_HEAD" node - <<'NODE'
          const fs = require('fs');
          const pull = JSON.parse(fs.readFileSync('artifacts/autopilot-audit-request/pull-freshness.json', 'utf8'));
          const requestedHead = String(process.env.REQUESTED_HEAD || '').toLowerCase();
          const currentHead = String(pull.head?.sha || '').toLowerCase();
          if (pull.state !== 'open' || currentHead !== requestedHead) {
            fs.writeFileSync('artifacts/autopilot-audit-request/audit-runner-result.json', JSON.stringify({
              status: 'NO_ACTION',
              reason: 'audit-request-stale-pr',
              requestedHead,
              currentHead: currentHead || null,
              prState: pull.state || null,
              liveAuthority: 'NONE',
              productionMutationAllowed: false,
              aiAuthority: 'ZERO_AUTHORITY',
            }, null, 2));
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'applicable=false\n');
            console.log(`Audit request is stale; no Audit or recovery is required (PR #${process.env.PR_NUMBER}).`);
            process.exit(0);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'applicable=true\n');
          NODE

      - name: Verify current PR head/base and canonical CI evidence
        if: ${{ steps.freshness.outputs.applicable == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.client_payload.pr_number }}
          REQUESTED_HEAD: ${{ github.event.client_payload.head_sha }}
          WORKFLOW_RUN_ID: ${{ github.event.client_payload.workflow_run_id }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > artifacts/autopilot-audit-request/pull-before-audit.json
          gh api "repos/$GITHUB_REPOSITORY/branches/main" > artifacts/autopilot-audit-request/main-before-audit.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$WORKFLOW_RUN_ID" > artifacts/autopilot-audit-request/workflow-run.json
          gh api "repos/$GITHUB_REPOSITORY/commits/$REQUESTED_HEAD/pulls" > artifacts/autopilot-audit-request/head-pulls.json
          node - <<'NODE'
          const fs = require('fs');
          const pull = JSON.parse(fs.readFileSync('artifacts/autopilot-audit-request/pull-before-audit.json', 'utf8'));
          const main = JSON.parse(fs.readFileSync('artifacts/autopilot-audit-request/main-before-audit.json', 'utf8'));
          const run = JSON.parse(fs.readFileSync('artifacts/autopilot-audit-request/workflow-run.json', 'utf8'));
          const headPulls = JSON.parse(fs.readFileSync('artifacts/autopilot-audit-request/head-pulls.json', 'utf8'));
          const pr = Number(process.env.PR_NUMBER);
          const expectedHead = process.env.REQUESTED_HEAD.toLowerCase();
          const fail = (message) => { console.error(message); process.exit(1); };
          if (pull.state !== 'open') fail(`PR is not open: ${pull.state}`);
          if (String(pull.head?.sha || '').toLowerCase() !== expectedHead) fail(`stale PR head: requested=${expectedHead} current=${pull.head?.sha}`);
          if (pull.base?.repo?.full_name !== process.env.GITHUB_REPOSITORY || pull.base?.ref !== 'main') fail('PR base repository/ref mismatch');
          const baseSha = String(pull.base?.sha || '').toLowerCase();
          const currentMain = String(main.commit?.sha || '').toLowerCase();
          if (!/^[0-9a-f]{40}$/.test(baseSha) || baseSha !== currentMain) fail(`Audit base is stale: base=${baseSha} main=${currentMain}`);
          fs.writeFileSync('artifacts/autopilot-audit-request/base-sha.txt', baseSha);
          if (run.name !== 'CI') fail(`unexpected workflow: ${run.name}`);
          if (run.event !== 'pull_request') fail(`unexpected workflow event: ${run.event}`);
          if (run.status !== 'completed' || run.conclusion !== 'success') fail(`CI is not successful: ${run.status}/${run.conclusion}`);
          if (String(run.head_sha || '').toLowerCase() !== expectedHead) fail(`CI head mismatch: ${run.head_sha}`);
          if (run.repository?.full_name !== process.env.GITHUB_REPOSITORY) fail('CI repository mismatch');
          const numbers = [...new Set(Array.isArray(run.pull_requests) ? run.pull_requests.map((value) => value?.number).filter((value) => Number.isSafeInteger(value) && value > 0) : [])];
          if (numbers.length === 1 && numbers[0] === pr) process.exit(0);
          if (!Array.isArray(headPulls)) fail('exact-head PR fallback response invalid');
          const matches = headPulls.filter((candidate) => candidate?.state === 'open'
            && String(candidate?.head?.sha || '').toLowerCase() === expectedHead
            && candidate?.base?.repo?.full_name === process.env.GITHUB_REPOSITORY);
          if (matches.length !== 1) fail(`exact-head PR identity unresolved: ${matches.length}`);
          if (matches[0]?.number !== pr) fail(`exact-head PR mismatch: expected=${pr} actual=${matches[0]?.number}`);
          NODE

      - name: Publish idempotent Audit request on PR
        if: ${{ steps.freshness.outputs.applicable == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.client_payload.pr_number }}
          REQUESTED_HEAD: ${{ github.event.client_payload.head_sha }}
          WORKFLOW_RUN_ID: ${{ github.event.client_payload.workflow_run_id }}
        run: |
          set -euo pipefail
          marker="<!-- nusa-audit-request:${PR_NUMBER}:${WORKFLOW_RUN_ID}:${REQUESTED_HEAD}:${GITHUB_RUN_ID} -->"
          existing="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" --jq ".[] | select(.body | contains(\"$marker\")) | .id" | head -n 1)"
          if [ -n "$existing" ]; then exit 0; fi
          cat > artifacts/autopilot-audit-request/audit-request.md <<EOF
          $marker
          ## NUSA Audit request

          - PR: #$PR_NUMBER
          - exact head: \`$REQUESTED_HEAD\`
          - canonical CI run: \`$WORKFLOW_RUN_ID\`
          - Audit execution run: \`$GITHUB_RUN_ID\`
          - CI result: **PASS**
          - next stage: **independent OIDC read-only Audit execution**
          - PR comments: **observability only / no authority**
          - stale-head/base rule: any change invalidates this request
          - liveAuthority: \`NONE\`
          - productionMutationAllowed: \`false\`
          - aiAuthority: \`ZERO_AUTHORITY\`
          EOF
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file artifacts/autopilot-audit-request/audit-request.md

      - name: Build independent Audit runner request
        if: ${{ steps.freshness.outputs.applicable == 'true' }}
        env:
          PR_NUMBER: ${{ github.event.client_payload.pr_number }}
          REQUESTED_HEAD: ${{ github.event.client_payload.head_sha }}
          WORKFLOW_RUN_ID: ${{ github.event.client_payload.workflow_run_id }}
          EXECUTION_ID: ${{ github.event.client_payload.execution_id }}
          DEDUPE_KEY: ${{ github.event.client_payload.dedupe_key }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const request = {
            kind: 'AUDIT_REQUEST',
            repository: process.env.GITHUB_REPOSITORY,
            prNumber: Number(process.env.PR_NUMBER),
            headSha: process.env.REQUESTED_HEAD,
            baseSha: fs.readFileSync('artifacts/autopilot-audit-request/base-sha.txt', 'utf8').trim(),
            workflowRunId: Number(process.env.WORKFLOW_RUN_ID),
            executionId: process.env.EXECUTION_ID,
            dedupeKey: process.env.DEDUPE_KEY,
            mutationAllowed: false,
            liveAuthority: 'NONE',
            productionMutationAllowed: false,
            aiAuthority: 'ZERO_AUTHORITY',
          };
          fs.writeFileSync('artifacts/autopilot-audit-request/audit-runner-request.json', JSON.stringify(request, null, 2));
          NODE

      - name: Mint bounded read-only Audit GitHub App token
        if: ${{ steps.freshness.outputs.applicable == 'true' }}
        id: audit-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.NUSA_AUDIT_READ_APP_ID }}
          private-key: ${{ secrets.NUSA_AUDIT_READ_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-actions: read
          permission-contents: read
          permission-pull-requests: read

      - name: Execute independent read-only Audit with GitHub OIDC
        if: ${{ steps.freshness.outputs.applicable == 'true' }}
        env:
          NUSA_AUDIT_RUNNER_URL: https://nusa-autopilot.desporin12.workers.dev/audit/execute
          NUSA_AUDIT_GITHUB_TOKEN: ${{ steps.audit-app-token.outputs.token }}
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const fail = (message) => { console.error(message); process.exit(1); };
          const request = JSON.parse(fs.readFileSync('artifacts/autopilot-audit-request/audit-runner-request.json', 'utf8'));
          const auditGithubToken = process.env.NUSA_AUDIT_GITHUB_TOKEN;
          if (!auditGithubToken) fail('bounded Audit GitHub App token missing');
          const oidcUrl = process.env.ACTIONS_ID_TOKEN_REQUEST_URL;
          const oidcRequestToken = process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN;
          if (!oidcUrl || !oidcRequestToken) fail('GitHub OIDC environment is unavailable');
          const tokenUrl = new URL(oidcUrl);
          tokenUrl.searchParams.set('audience', 'nusa-autopilot');
          const oidcResponse = await fetch(tokenUrl, { headers: { authorization: `Bearer ${oidcRequestToken}`, accept: 'application/json' } });
          if (!oidcResponse.ok) fail(`OIDC request failed: ${oidcResponse.status}`);
          const oidc = await oidcResponse.json();
          if (!oidc || typeof oidc.value !== 'string' || !oidc.value) fail('OIDC token missing');
          const response = await fetch(process.env.NUSA_AUDIT_RUNNER_URL, {
            method: 'POST',
            headers: { authorization: `Bearer ${oidc.value}`, 'content-type': 'application/json', 'x-nusa-audit-github-token': auditGithubToken },
            body: JSON.stringify(request),
          });
          const result = await response.json().catch(() => null);
          fs.writeFileSync('artifacts/autopilot-audit-request/audit-runner-result.json', JSON.stringify(result ?? { status: 'INVALID_RESPONSE' }, null, 2));
          if (!response.ok) fail(`Audit runner rejected request: ${response.status} ${result?.error || result?.status || 'unknown'}`);
          if (!result || result.accepted !== true || result.status !== 'AUDIT_COMPLETED') fail('Audit runner response is not a completed Audit');
          if (result.schemaVersion !== 1) fail('Audit schema version invalid');
          if (!['PASS', 'PASS_WITH_NOTES', 'FAIL'].includes(result.verdict)) fail('Audit verdict invalid');
          if (result.repository !== request.repository || result.prNumber !== request.prNumber) fail('Audit repository/PR identity mismatch');
          if (result.reviewedHeadSha !== request.headSha || result.baseSha !== request.baseSha || result.workflowRunId !== request.workflowRunId) fail('Audit exact-head/base/CI evidence mismatch');
          if (result.liveAuthority !== 'NONE' || result.productionMutationAllowed !== false || result.aiAuthority !== 'ZERO_AUTHORITY') fail('Audit safety invariant response invalid');
          if (result.verdict === 'PASS' && result.mergeAllowed !== true) fail('PASS verdict must explicitly allow merge');
          if (result.verdict === 'PASS_WITH_NOTES' && typeof result.mergeAllowed !== 'boolean') fail('PASS_WITH_NOTES must explicitly declare mergeAllowed');
          if (result.verdict === 'FAIL' && result.mergeAllowed !== false) fail('FAIL verdict cannot allow merge');
          NODE

      - name: Classify Audit failure boundary
        if: ${{ always() && steps.freshness.outputs.applicable == 'true' }}
        id: classify-audit
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = 'artifacts/autopilot-audit-request/audit-runner-result.json';
          let result = {};
          try {
            if (fs.existsSync(path)) result = JSON.parse(fs.readFileSync(path, 'utf8'));
          } catch {
            result = {};
          }
          const text = `${result.error || ''} ${result.reason || ''} ${result.status || ''}`;
          let failureClass = 'unsafe_or_ambiguous';
          let recovery = 'none';
          if (result.status === 'AUDIT_COMPLETED') {
            failureClass = 'none';
          } else if (result.error === "WAITING_PROVIDER_CAPACITY" || result.status === "WAITING_PROVIDER_CAPACITY") {
            // Capacity waits already carry a durable provider hold and nextRetryAt.
            // They must never be converted into coding work or immediate Audit retry.
            failureClass = 'provider_capacity';
            recovery = 'hold';
          } else if (/4006|daily free allocation|neurons|quota|429/i.test(text)) {
            failureClass = 'provider_capacity';
            recovery = 'hold';
          } else if (/AUDIT_(VERDICT|MODEL_RESPONSE)|JSON_INVALID/i.test(text)) {
            // A malformed model verdict says nothing about the PR. Keep recovery in the Audit lane.
            failureClass = 'validation_failure';
            recovery = 'retry';
          } else if (/AUDIT_(PR_NOT_OPEN|PR_HEAD_MISMATCH|PR_BASE_MISMATCH|CI_NOT_SUCCESSFUL|CI_HEAD_MISMATCH|CI_REPOSITORY_MISMATCH)|stale|closed|head moved|base moved/i.test(text)) {
            failureClass = 'deterministic';
          } else if (/WAITING_PROVIDER_CAPACITY|429|5\\d\\d|timeout|timed out|fetch failed|temporar|network|ECONN/i.test(text)) {
            failureClass = 'transient';
            recovery = 'retry';
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `failure_class=${failureClass}\nrecovery=${recovery}\n`);
          console.log(`auditFailureClass=${failureClass} recovery=${recovery}`);
          NODE

      - name: Re-verify exact head/base/main after Audit execution
        if: ${{ steps.freshness.outputs.applicable == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.client_payload.pr_number }}
          REQUESTED_HEAD: ${{ github.event.client_payload.head_sha }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > artifacts/autopilot-audit-request/pull-after-audit.json
          gh api "repos/$GITHUB_REPOSITORY/branches/main" > artifacts/autopilot-audit-request/main-after-audit.json
          before_base="$(cat artifacts/autopilot-audit-request/base-sha.txt)"
          current_head="$(node -p "require('./artifacts/autopilot-audit-request/pull-after-audit.json').head.sha")"
          current_base="$(node -p "require('./artifacts/autopilot-audit-request/pull-after-audit.json').base.sha")"
          current_main="$(node -p "require('./artifacts/autopilot-audit-request/main-after-audit.json').commit.sha")"
          current_state="$(node -p "require('./artifacts/autopilot-audit-request/pull-after-audit.json').state")"
          test "$current_state" = "open" || { echo "PR changed state during Audit: $current_state"; exit 1; }
          test "$current_head" = "$REQUESTED_HEAD" || { echo "PR head moved during Audit: expected=$REQUESTED_HEAD current=$current_head"; exit 1; }
          test "$current_base" = "$before_base" || { echo "PR base moved during Audit: expected=$before_base current=$current_base"; exit 1; }
          test "$current_main" = "$before_base" || { echo "main moved during Audit: audited_base=$before_base current_main=$current_main"; exit 1; }

      - name: Enforce Audit verdict gate
        if: ${{ steps.freshness.outputs.applicable == 'true' }}
        run: |
          node - <<'NODE'
          const result = require('./artifacts/autopilot-audit-request/audit-runner-result.json');
          if (!['PASS', 'PASS_WITH_NOTES'].includes(result.verdict) || result.mergeAllowed !== true || result.safetyInvariantResult !== 'PASS' || result.blockers.length !== 0) {
            console.error(`Audit blocks automatic Release: ${result.verdict}`);
            process.exit(1);
          }
          console.log('Audit permits automatic Release handoff: PASS');
          NODE

      - name: Bind trusted same-workflow Audit authority
        if: ${{ steps.freshness.outputs.applicable == 'true' }}
        id: audit-authority
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const result = JSON.parse(fs.readFileSync('artifacts/autopilot-audit-request/audit-runner-result.json', 'utf8'));
          const authority = {
            schemaVersion: result.schemaVersion,
            status: result.status,
            repository: result.repository,
            prNumber: result.prNumber,
            reviewedHeadSha: result.reviewedHeadSha,
            baseSha: result.baseSha,
            workflowRunId: result.workflowRunId,
            verdict: result.verdict,
            mergeAllowed: result.mergeAllowed,
            safetyInvariantResult: result.safetyInvariantResult,
            liveAuthority: result.liveAuthority,
            productionMutationAllowed: result.productionMutationAllowed,
            aiAuthority: result.aiAuthority,
            auditExecutionRunId: Number(process.env.GITHUB_RUN_ID),
            auditExecutionAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
          };
          const encoded = Buffer.from(JSON.stringify(authority), 'utf8').toString('base64url');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `authority=${encoded}\n`);
          fs.writeFileSync('artifacts/autopilot-audit-request/trusted-audit-authority.json', JSON.stringify(authority, null, 2));
          NODE

      - name: Publish observability-only exact-head Audit verdict
        if: ${{ steps.freshness.outputs.applicable == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.client_payload.pr_number }}
          REQUESTED_HEAD: ${{ github.event.client_payload.head_sha }}
          WORKFLOW_RUN_ID: ${{ github.event.client_payload.workflow_run_id }}
        run: |
          set -euo pipefail
          marker="<!-- nusa-audit-observation:${GITHUB_RUN_ID}:${PR_NUMBER}:${WORKFLOW_RUN_ID}:${REQUESTED_HEAD} -->"
          existing="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" --jq ".[] | select(.body | contains(\"$marker\")) | .id" | head -n 1)"
          if [ -n "$existing" ]; then exit 0; fi
          node - <<'NODE'
          const fs = require('fs');
          const result = JSON.parse(fs.readFileSync('artifacts/autopilot-audit-request/audit-runner-result.json', 'utf8'));
          const marker = `<!-- nusa-audit-observation:${process.env.GITHUB_RUN_ID}:${process.env.PR_NUMBER}:${process.env.WORKFLOW_RUN_ID}:${process.env.REQUESTED_HEAD} -->`;
          const body = [
            marker,
            '## NUSA independent Audit verdict',
            '',
            `- verdict: **${result.verdict}**`,
            `- exact head: \`${result.reviewedHeadSha}\``,
            `- base: \`${result.baseSha}\``,
            `- canonical CI run: \`${result.workflowRunId}\``,
            `- Audit execution run: \`${process.env.GITHUB_RUN_ID}\``,
            `- merge allowed by Audit: \`${result.mergeAllowed}\``,
            `- safety invariants: **${result.safetyInvariantResult}**`,
            '- authorization source: **same-workflow trusted output; this comment has no authority**',
            '- repository mutation by Audit: `NONE`',
            '- stale-head/base rule: any change invalidates this verdict',
          ].join('\n');
          fs.writeFileSync('artifacts/autopilot-audit-request/audit-verdict.md', body + '\n');
          NODE
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file artifacts/autopilot-audit-request/audit-verdict.md

      - name: Upload Audit execution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: autopilot-audit-request-${{ github.run_id }}
          path: artifacts/autopilot-audit-request

  release-handoff:
    needs: audit-request
    if: >-
      ${{ needs.audit-request.result == 'success' &&
          needs.audit-request.outputs.applicable == 'true' &&
          needs.audit-request.outputs.authority != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
      contents: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.client_payload.pr_number }}
      REQUESTED_HEAD: ${{ github.event.client_payload.head_sha }}
      WORKFLOW_RUN_ID: ${{ github.event.client_payload.workflow_run_id }}
      EXECUTION_ID: ${{ github.event.client_payload.execution_id }}
      DEDUPE_KEY: ${{ github.event.client_payload.dedupe_key }}
      AUDIT_AUTHORITY: ${{ needs.audit-request.outputs.authority }}
      AUDIT_EXECUTION_RUN_ID: ${{ github.run_id }}
    steps:
      - name: Validate trusted Audit authority and exact release handoff identity
        id: authority
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const fail = (message) => { console.error(message); process.exit(1); };
          let authority;
          try {
            authority = JSON.parse(Buffer.from(process.env.AUDIT_AUTHORITY || '', 'base64url').toString('utf8'));
          } catch {
            fail('trusted Audit authority is invalid');
          }
          const prNumber = Number(process.env.PR_NUMBER);
          const workflowRunId = Number(process.env.WORKFLOW_RUN_ID);
          const auditExecutionRunId = Number(process.env.AUDIT_EXECUTION_RUN_ID);
          if (authority.schemaVersion !== 1 || authority.status !== 'AUDIT_COMPLETED') fail('trusted Audit authority status invalid');
          if (authority.repository !== process.env.GITHUB_REPOSITORY || authority.prNumber !== prNumber) fail('trusted Audit repository/PR identity mismatch');
          if (authority.reviewedHeadSha !== process.env.REQUESTED_HEAD || authority.workflowRunId !== workflowRunId) fail('trusted Audit exact-head/CI identity mismatch');
          if (authority.auditExecutionRunId !== auditExecutionRunId) fail('trusted Audit same-workflow execution identity mismatch');
          if (!['PASS', 'PASS_WITH_NOTES'].includes(authority.verdict) || authority.mergeAllowed !== true || authority.safetyInvariantResult !== 'PASS') fail('trusted Audit does not authorize Release handoff');
          if (authority.liveAuthority !== 'NONE' || authority.productionMutationAllowed !== false || authority.aiAuthority !== 'ZERO_AUTHORITY') fail('trusted Audit safety invariant mismatch');
          if (!/^[0-9a-f]{40}$/i.test(authority.baseSha || '')) fail('trusted Audit base SHA invalid');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `audited_base=${authority.baseSha.toLowerCase()}\n`);
          NODE

      - name: Re-verify exact PR head and audited base before Release handoff
        env:
          AUDITED_BASE: ${{ steps.authority.outputs.audited_base }}
        run: |
          set -euo pipefail
          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          hold="$(jq -r 'if (.labels | type) != "array" then "invalid" elif any(.labels[]; (.name | type) != "string") then "invalid" elif any(.labels[]; (.name | ascii_downcase) == "hold") then "true" else "false" end' <<<"$pr")"
          test "$(jq -r '.state' <<<"$pr")" = "open"
          test "$(jq -r '.draft // false' <<<"$pr")" = "false"
          test "$hold" = "false"
          test "$(jq -r '.head.sha' <<<"$pr")" = "$REQUESTED_HEAD"
          test "$(jq -r '.base.ref' <<<"$pr")" = "main"
          test "$(jq -r '.base.repo.full_name' <<<"$pr")" = "$GITHUB_REPOSITORY"
          test "$(jq -r '.base.sha' <<<"$pr")" = "$AUDITED_BASE"
          test "$current_main" = "$AUDITED_BASE"

      - name: Dispatch deterministic Release successor once
        run: |
          set -euo pipefail
          existing="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/autopilot-deterministic-audit-release.yml/runs?event=repository_dispatch&per_page=100" --jq ".workflow_runs[] | select((.display_title == \"$DEDUPE_KEY\") or ((.display_title | test(\"^audit:${PR_NUMBER}:${WORKFLOW_RUN_ID}(:[0-9]+)?:${REQUESTED_HEAD}$\")) and ((.status != \"completed\") or (.conclusion == \"success\")))) | .id" | head -n 1)"
          if [ -n "$existing" ]; then
            echo "Deterministic Release successor already exists for $DEDUPE_KEY via run $existing; suppressing duplicate dispatch."
            exit 0
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/dispatches" --input - <<EOF
          {
            "event_type": "nusa_autopilot_audit",
            "client_payload": {
              "kind": "AUDIT_REQUEST",
              "repository": "$GITHUB_REPOSITORY",
              "head_sha": "$REQUESTED_HEAD",
              "pr_number": $PR_NUMBER,
              "workflow_run_id": $WORKFLOW_RUN_ID,
              "execution_id": "$EXECUTION_ID",
              "dedupe_key": "$DEDUPE_KEY",
              "live_authority": "NONE",
              "production_mutation_allowed": false,
              "ai_authority": "ZERO_AUTHORITY"
            }
          }
          EOF
          echo "Dispatched deterministic Release successor for PR #$PR_NUMBER at exact head $REQUESTED_HEAD."

  audit-recovery:
    needs: audit-request
    if: ${{ always() && github.event.client_payload.kind == 'AUDIT_REQUEST' && needs.audit-request.result == 'failure' && needs.audit-request.outputs.recovery == 'retry' && github.event.client_payload.audit_retry_attempt != 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Dispatch one bounded Audit retry on the same exact evidence
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.client_payload.pr_number }}
          REQUESTED_HEAD: ${{ github.event.client_payload.head_sha }}
          WORKFLOW_RUN_ID: ${{ github.event.client_payload.workflow_run_id }}
        run: |
          set -euo pipefail
          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          state="$(node -e 'const p=JSON.parse(process.argv[1]); process.stdout.write(String(p.state||""))' "$pr")"
          current_head="$(node -e 'const p=JSON.parse(process.argv[1]); process.stdout.write(String(p.head?.sha||""))' "$pr")"
          current_base="$(node -e 'const p=JSON.parse(process.argv[1]); process.stdout.write(String(p.base?.sha||""))' "$pr")"
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          if [ "$state" != "open" ] || [ "$current_head" != "$REQUESTED_HEAD" ] || [ "$current_base" != "$current_main" ]; then
            echo 'Audit recovery suppressed: PR is closed, head moved, or base is stale.'
            exit 0
          fi
          execution_id="audit-retry:${PR_NUMBER}:${WORKFLOW_RUN_ID}:1"
          dedupe_key="audit-retry:${PR_NUMBER}:${REQUESTED_HEAD}:${WORKFLOW_RUN_ID}:1"
          gh api --method POST "repos/$GITHUB_REPOSITORY/dispatches" --input - <<EOF
          {
            "event_type": "nusa_autopilot_execution",
            "client_payload": {
              "kind": "AUDIT_REQUEST",
              "repository": "$GITHUB_REPOSITORY",
              "head_sha": "$REQUESTED_HEAD",
              "pr_number": $PR_NUMBER,
              "workflow_run_id": $WORKFLOW_RUN_ID,
              "audit_retry_attempt": 1,
              "execution_id": "$execution_id",
              "dedupe_key": "$dedupe_key",
              "live_authority": "NONE",
              "production_mutation_allowed": false,
              "ai_authority": "ZERO_AUTHORITY"
            }
          }
          EOF
