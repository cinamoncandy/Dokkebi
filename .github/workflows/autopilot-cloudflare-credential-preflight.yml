name: Autopilot Cloudflare Credential Preflight

on:
  workflow_dispatch:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'apps/autopilot/**'
      - '.github/workflows/autopilot-cloudflare-deploy.yml'
      - '.github/workflows/autopilot-cloudflare-runtime-proof.yml'
      - '.github/workflows/autopilot-cloudflare-credential-preflight.yml'
      - '.github/workflows/autopilot-execution-consumer.yml'

# Secret-bearing validation and repository mutation authority are isolated by job.
permissions: {}

concurrency:
  group: nusa-cloudflare-credential-preflight
  cancel-in-progress: false

env:
  NUSA_WORKER_HEALTH_URL: https://nusa-autopilot.desporin12.workers.dev/health

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      current_main: ${{ steps.main.outputs.sha }}
      deployment_status: ${{ steps.deploy.outputs.status }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NUSA_GITHUB_TOKEN: ${{ secrets.NUSA_AUTOPILOT_GITHUB_TOKEN }}
    steps:
      - name: Resolve current protected main
        id: main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          if ! [[ "$current_main" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::Unable to resolve exact current main SHA. Failing closed.'
            exit 1
          fi
          echo "sha=$current_main" >> "$GITHUB_OUTPUT"

      - name: Checkout trusted current main only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.main.outputs.sha }}
          # Full history so a runtime-unchanged exact main can be proven against the live revision.
          fetch-depth: 0

      - name: Verify no untrusted PR code is executed
        if: github.event_name == 'pull_request_target'
        env:
          EXPECTED_MAIN: ${{ steps.main.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          echo 'Preflight is executing trusted current-main code only; PR head is never checked out.'

      - name: Validate Cloudflare credential inputs
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo '::error::CLOUDFLARE_API_TOKEN is missing. BLOCKED_HUMAN.'
            exit 1
          fi
          if ! [[ "${CLOUDFLARE_ACCOUNT_ID:-}" =~ ^[0-9a-fA-F]{32}$ ]]; then
            echo '::error::CLOUDFLARE_ACCOUNT_ID is missing or malformed. BLOCKED_HUMAN.'
            exit 1
          fi

      - name: Validate runtime GitHub credential before Cloudflare sync
        run: |
          set -euo pipefail
          if [ -z "${NUSA_GITHUB_TOKEN:-}" ]; then
            echo '::error::NUSA_AUTOPILOT_GITHUB_TOKEN is missing. BLOCKED_HUMAN.'
            exit 1
          fi
          http_status="$(curl -sS -o /tmp/nusa-github-credential-probe.json -w '%{http_code}' --max-time 20             -H "Authorization: Bearer $NUSA_GITHUB_TOKEN"             -H 'Accept: application/vnd.github+json'             -H 'X-GitHub-Api-Version: 2022-11-28'             "https://api.github.com/repos/$GITHUB_REPOSITORY" || printf '000')"
          if [ "$http_status" != "200" ]; then
            rm -f /tmp/nusa-github-credential-probe.json
            echo "::error::Runtime GitHub credential rejected by GitHub API (HTTP $http_status). BLOCKED_HUMAN."
            exit 1
          fi
          REPOSITORY="$GITHUB_REPOSITORY" node - <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync('/tmp/nusa-github-credential-probe.json', 'utf8'));
          if (payload.full_name !== process.env.REPOSITORY) {
            throw new Error('Runtime GitHub credential resolved an unexpected repository identity');
          }
          console.log('Runtime GitHub credential read-only repository probe PASS.');
          NODE
          rm -f /tmp/nusa-github-credential-probe.json

      - name: Check Cloudflare API token self-verification (informational only)
        run: |
          set -euo pipefail
          response="$(curl -sS --max-time 20 \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Accept: application/json' \
            https://api.cloudflare.com/client/v4/user/tokens/verify)" || true
          RESPONSE="${response:-}" node - <<'NODE'
          let payload = {};
          try {
            payload = JSON.parse(process.env.RESPONSE || '{}');
          } catch {
            console.log('Cloudflare API token self-verify returned a non-JSON response; treating this observational probe as inconclusive and deferring to functional Worker checks.');
          }
          if (payload.success === true && payload.result?.status === 'active') {
            console.log('Cloudflare API token status: active (self-verify confirms).');
          } else {
            console.log('Cloudflare API token self-verify inconclusive; functional Worker checks remain authoritative.');
          }
          NODE

      - name: Verify configured Cloudflare account is accessible
        run: |
          set -euo pipefail
          response="$(curl -sS --fail-with-body --max-time 20 \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Accept: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID")" || {
              echo '::error::Configured Cloudflare account is not accessible with this token. BLOCKED_HUMAN.'
              exit 1
            }
          RESPONSE="$response" EXPECTED_ACCOUNT="$CLOUDFLARE_ACCOUNT_ID" node - <<'NODE'
          const payload = JSON.parse(process.env.RESPONSE || '{}');
          const expected = String(process.env.EXPECTED_ACCOUNT || '').toLowerCase();
          const observed = String(payload.result?.id || '').toLowerCase();
          if (payload.success !== true || observed !== expected) {
            console.error('Cloudflare account identity verification failed.');
            process.exit(1);
          }
          console.log('Configured Cloudflare account identity verified.');
          NODE

      - name: Enable pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Wrangler account authentication
        run: |
          set -euo pipefail
          if ! pnpm dlx wrangler@4.127.1 whoami --config apps/autopilot/wrangler.jsonc >/dev/null 2>&1; then
            echo '::error::Wrangler authentication/account verification failed. BLOCKED_HUMAN.'
            exit 1
          fi
          echo 'Wrangler authenticated against the configured Cloudflare account.'

      - name: Verify free-tier Worker configuration has no paid Container binding
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const text = fs.readFileSync('apps/autopilot/wrangler.jsonc', 'utf8');
          const config = JSON.parse(text.replace(/^\s*\/\/.*$/gm, ''));
          if (Array.isArray(config.containers) && config.containers.length > 0) throw new Error('Paid Cloudflare Containers binding is still configured');
          const bindings = config.durable_objects?.bindings || [];
          if (bindings.some((binding) => binding?.name === 'Sandbox')) throw new Error('Paid Sandbox Durable Object binding is still configured');
          console.log('Workers Free-compatible configuration verified: no paid Container/Sandbox binding.');
          NODE

      - name: Require successful exact-main Cloudflare deployment
        id: deploy
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_MAIN: ${{ steps.main.outputs.sha }}
        run: |
          set -euo pipefail
          DEPLOY_RUN_ID=""
          DEPLOY_MODE=""
          for attempt in $(seq 1 18); do
            # No status filter: on 2026-11-11 the API omitted a completed, successful Deploy run from the status=completed list for exact main.
            # The node filter below still requires conclusion === success, which only a completed run has.
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$CURRENT_MAIN&per_page=100" > /tmp/nusa-main-runs-pages.json
            mapfile -t DEPLOY_CANDIDATES < <(CURRENT_MAIN="$CURRENT_MAIN" node - <<'NODE'
          const fs = require('fs');
          const pages = JSON.parse(fs.readFileSync('/tmp/nusa-main-runs-pages.json', 'utf8'));
          const expected = process.env.CURRENT_MAIN.toLowerCase();
          const runs = (Array.isArray(pages) ? pages.flatMap((page) => page?.workflow_runs || []) : [])
            .filter((run) => run?.name === 'Autopilot Cloudflare Deploy'
              && run?.path === '.github/workflows/autopilot-cloudflare-deploy.yml'
              && String(run?.head_sha || '').toLowerCase() === expected
              && run?.conclusion === 'success')
            .sort((a, b) => Number(b?.id || 0) - Number(a?.id || 0));
          for (const run of runs) console.log(run.id);
          NODE
          )
            for run_id in "${DEPLOY_CANDIDATES[@]}"; do
              [ -n "$run_id" ] || continue
              gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" > /tmp/nusa-deploy-jobs.json
              if node - <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync('/tmp/nusa-deploy-jobs.json', 'utf8'));
          const deployStepName = 'Deploy exact CI-verified revision to Cloudflare Workers Free-compatible runtime';
          const verifyStepName = 'Verify deployed Worker reports the exact-head revision and fail-closed authority';
          const scopeStepName = 'Determine whether exact main changes Worker runtime inputs';
          const jobs = payload.jobs || [];
          const deployJob = jobs.find((job) => job?.name === 'Deploy exact CI-verified Worker revision');
          const steps = deployJob?.steps || [];
          const deployStep = steps.find((step) => step?.name === deployStepName);
          const verifyStep = steps.find((step) => step?.name === verifyStepName);
          const scopeStep = steps.find((step) => step?.name === scopeStepName);
          const credentialStepNames = [
            'Verify Cloudflare deployment credentials and account access',
            'Sync persistent Autopilot runtime bearer secret',
            'Sync Worker GitHub API credential',
          ];
          const credentialsSynced = credentialStepNames.every((name) => steps.find((step) => step?.name === name)?.conclusion === 'success');
          if (deployJob?.conclusion !== 'success') process.exit(1);
          if (deployStep?.conclusion === 'success' && verifyStep?.conclusion === 'success') {
            fs.writeFileSync('/tmp/nusa-deploy-mode', 'deployed');
            process.exit(0);
          }
          // The canonical deploy workflow skips the rollout when exact main has no Worker
          // runtime-input delta since its last successful deployment. Accept that only when the
          // scope step itself succeeded, the credentials were verified and re-synchronized into the
          // live Worker on this run, and only the rollout and its verification were skipped; the live
          // revision is then proven runtime-equivalent to exact main in the next step.
          if (scopeStep?.conclusion === 'success'
              && credentialsSynced
              && deployStep?.conclusion === 'skipped'
              && verifyStep?.conclusion === 'skipped') {
            fs.writeFileSync('/tmp/nusa-deploy-mode', 'runtime_unchanged');
            process.exit(0);
          }
          process.exit(1);
          NODE
              then
                DEPLOY_RUN_ID="$run_id"
                DEPLOY_MODE="$(cat /tmp/nusa-deploy-mode)"
                break
              fi
            done
            if [ -n "$DEPLOY_RUN_ID" ]; then
              break
            fi
            echo "waiting for executed exact-main deploy evidence (attempt ${attempt}/18)"
            if [[ "$attempt" -lt 18 ]]; then sleep 10; fi
          done
          if [ -z "$DEPLOY_RUN_ID" ]; then
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$CURRENT_MAIN&per_page=100" > /tmp/nusa-main-all-runs-pages.json
            if CURRENT_MAIN="$CURRENT_MAIN" node - <<'NODE'
          const fs = require('fs');
          const pages = JSON.parse(fs.readFileSync('/tmp/nusa-main-all-runs-pages.json', 'utf8'));
          const expected = process.env.CURRENT_MAIN.toLowerCase();
          const active = new Set(['queued', 'in_progress', 'pending', 'waiting', 'requested']);
          const runs = (Array.isArray(pages) ? pages.flatMap((page) => page?.workflow_runs || []) : []);
          const converging = runs.some((run) =>
            String(run?.head_sha || '').toLowerCase() === expected
            && active.has(String(run?.status || ''))
            && (run?.name === 'CI' || run?.name === 'Autopilot Cloudflare Deploy'));
          process.exit(converging ? 0 : 1);
          NODE
            then
              echo "status=pending" >> "$GITHUB_OUTPUT"
              echo "PENDING exact-main CI/deploy convergence is still active for $CURRENT_MAIN; abstaining without opening a false blocker."
              exit 0
            fi
            echo "::error::No successful exact-main Cloudflare deploy and no bounded active CI/deploy convergence for $CURRENT_MAIN"
            exit 1
          fi
          echo "status=ready" >> "$GITHUB_OUTPUT"
          echo "mode=$DEPLOY_MODE" >> "$GITHUB_OUTPUT"
          echo "Exact-main Cloudflare deploy PASS: run_id=$DEPLOY_RUN_ID mode=$DEPLOY_MODE"

      - name: Require live Worker revision equals exact current main
        if: steps.deploy.outputs.status == 'ready' && steps.deploy.outputs.mode == 'deployed'
        env:
          CURRENT_MAIN: ${{ steps.main.outputs.sha }}
        run: |
          set -euo pipefail
          HEALTH_REVISION=""
          for attempt in $(seq 1 18); do
            if curl -sS --fail-with-body --max-time 20 "$NUSA_WORKER_HEALTH_URL" > /tmp/nusa-worker-health.json; then
              HEALTH_REVISION="$(node -p "String(require('/tmp/nusa-worker-health.json').deploymentRevision || '').toLowerCase()")"
            else
              HEALTH_REVISION=""
            fi
            if [[ "$HEALTH_REVISION" == "${CURRENT_MAIN,,}" ]]; then
              break
            fi
            echo "waiting for Worker deployment revision (attempt ${attempt}/18, expected=$CURRENT_MAIN actual=${HEALTH_REVISION:-unknown})"
            if [[ "$attempt" -lt 18 ]]; then sleep 10; fi
          done
          CURRENT_MAIN="$CURRENT_MAIN" node - <<'NODE'
          const fs = require('fs');
          const health = JSON.parse(fs.readFileSync('/tmp/nusa-worker-health.json', 'utf8'));
          const expected = process.env.CURRENT_MAIN.toLowerCase();
          const deployed = String(health.deploymentRevision || '').toLowerCase();
          if (deployed !== expected) throw new Error(`Worker deploymentRevision mismatch: expected=${expected} actual=${deployed || 'unknown'}`);
          if (health.liveAuthority !== 'NONE' || health.productionMutationAllowed !== false || health.aiAuthority !== 'ZERO_AUTHORITY') {
            throw new Error('Worker safety invariants are not fail-closed');
          }
          console.log(`Worker exact-main runtime baseline PASS: ${deployed}`);
          NODE

      - name: Require live Worker revision is runtime-equivalent to exact current main
        if: steps.deploy.outputs.status == 'ready' && steps.deploy.outputs.mode == 'runtime_unchanged'
        env:
          CURRENT_MAIN: ${{ steps.main.outputs.sha }}
        run: |
          set -euo pipefail
          HEALTH_REVISION=""
          for attempt in $(seq 1 6); do
            if curl -sS --fail-with-body --max-time 20 "$NUSA_WORKER_HEALTH_URL" > /tmp/nusa-worker-health.json; then
              HEALTH_REVISION="$(node -p "String(require('/tmp/nusa-worker-health.json').deploymentRevision || '').toLowerCase()")"
              break
            fi
            echo "waiting for Worker health (attempt ${attempt}/6)"
            if [[ "$attempt" -lt 6 ]]; then sleep 10; fi
          done
          if ! [[ "$HEALTH_REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Worker deploymentRevision is missing or malformed: ${HEALTH_REVISION:-unknown}"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$HEALTH_REVISION" "$CURRENT_MAIN"; then
            echo "::error::Live Worker revision $HEALTH_REVISION is not an ancestor of exact main $CURRENT_MAIN"
            exit 1
          fi
          scope="$(git diff --no-renames --name-only -z "$HEALTH_REVISION" "$CURRENT_MAIN" | node scripts/autopilot-worker-deploy-scope.js)"
          if [ "$scope" != 'worker_runtime_changed=false' ]; then
            echo "::error::Exact main $CURRENT_MAIN changes Worker runtime inputs since live revision $HEALTH_REVISION ($scope)"
            exit 1
          fi
          node - <<'NODE'
          const fs = require('fs');
          const health = JSON.parse(fs.readFileSync('/tmp/nusa-worker-health.json', 'utf8'));
          if (health.liveAuthority !== 'NONE' || health.productionMutationAllowed !== false || health.aiAuthority !== 'ZERO_AUTHORITY') {
            throw new Error('Worker safety invariants are not fail-closed');
          }
          // The executed-deploy path proves zero-credit mode in the deploy workflow; prove it here too. The expected value is
          // derived from the deploy workflow's single NUSA_ZERO_CREDIT_MODE source so this gate cannot drift from what is deployed.
          const deployWorkflow = fs.readFileSync('.github/workflows/autopilot-cloudflare-deploy.yml', 'utf8');
          const posture = /^\s*NUSA_ZERO_CREDIT_MODE:\s*"(true|false)"\s*$/m.exec(deployWorkflow);
          if (posture == null) throw new Error('Deploy workflow NUSA_ZERO_CREDIT_MODE is missing');
          const expectedZeroCredit = posture[1] === 'true' ? 'ENFORCED' : 'DISABLED';
          if (health.zeroCreditMode !== expectedZeroCredit) throw new Error(`Worker zeroCreditMode is ${health.zeroCreditMode}, expected ${expectedZeroCredit}`);
          NODE
          echo "Worker runtime-equivalent baseline PASS: live=$HEALTH_REVISION main=$CURRENT_MAIN (no Worker runtime-input delta)"

      - name: Record fail-closed preflight evidence
        if: always()
        env:
          CURRENT_MAIN: ${{ steps.main.outputs.sha }}
        run: |
          echo "currentMain=${CURRENT_MAIN:-unknown}"
          echo "deploymentStatus=${{ steps.deploy.outputs.status || 'unknown' }}"
          echo 'runtime=cloudflare-workers-free-compatible'
          echo 'liveAuthority=NONE'
          echo 'productionMutationAllowed=false'
          echo 'AI authority=ZERO_AUTHORITY'
  blocker:
    needs: preflight
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      CURRENT_MAIN: ${{ needs.preflight.outputs.current_main }}
    steps:
        - name: Open or refresh canonical P0 Release blocker on failure
          if: ${{ needs.preflight.result != 'success' }}
          env:
            CURRENT_MAIN: ${{ needs.preflight.outputs.current_main }}
          run: |
            set -euo pipefail
            marker='<!-- nusa-cloudflare-credential-preflight-p0 -->'
            issue_number="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues?state=all&per_page=100" --jq ".[] | select((.pull_request|not) and (.body // \"\" | contains(\"$marker\"))) | .number" | head -n 1)"
            body_file="$(mktemp)"
            cat > "$body_file" <<EOF
            $marker
            Refs #903
  
            Cloudflare Workers deployment/runtime baseline is unhealthy. Release must remain serialized until the trusted preflight proves all of the following on current main:
            - API token exists and the configured Cloudflare account is accessible;
            - runtime GitHub credential passes a read-only exact-repository API probe before Worker secret sync;
            - Wrangler authenticates against the configured account;
            - the Worker configuration contains no paid Container/Sandbox binding;
            - the exact-main canonical deploy run succeeds, either
              - with an executed Worker deploy, and canonical Worker /health deploymentRevision equals exact current main, or
              - with the rollout skipped for no Worker runtime-input delta, after verifying and re-synchronizing the runtime credentials, and /health deploymentRevision is an ancestor of exact current main with no Worker runtime-input delta and zeroCreditMode ENFORCED;
            - fail-closed authority invariants remain NONE / false / ZERO_AUTHORITY.
  
            Current-main observation: ${CURRENT_MAIN:-unresolved}
            Classification: BLOCKED_HUMAN only when credentials/account access are invalid; deployment/code failures remain fail-closed engineering blockers.
            This issue is maintained by the trusted current-main preflight workflow. No PR comment can override it.
            EOF
            if [ -n "$issue_number" ]; then
              gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/$issue_number" -f state='open' -f title='P0: Cloudflare deployment credential/runtime baseline unhealthy' -F body=@"$body_file" >/dev/null
              echo "Canonical Cloudflare P0 blocker active: #$issue_number"
            else
              gh api --method POST "repos/$GITHUB_REPOSITORY/issues" -f title='P0: Cloudflare deployment credential/runtime baseline unhealthy' -F body=@"$body_file" >/tmp/nusa-created-blocker.json
              echo "Canonical Cloudflare P0 blocker created: #$(node -p "require('/tmp/nusa-created-blocker.json').number")"
            fi
  
        - name: Close canonical P0 Release blocker after trusted-main recovery
          if: ${{ needs.preflight.result == 'success' && github.event_name != 'pull_request_target' && needs.preflight.outputs.deployment_status == 'ready' }}
          run: |
            set -euo pipefail
            marker='<!-- nusa-cloudflare-credential-preflight-p0 -->'
            gh api --paginate "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" --jq ".[] | select((.pull_request|not) and (.body // \"\" | contains(\"$marker\"))) | .number" | while read -r issue_number; do
              [ -n "$issue_number" ] || continue
              gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/$issue_number" -f state='closed' >/dev/null
              echo "Closed recovered Cloudflare P0 blocker #$issue_number"
            done


