name: NUSA Isolated Causal Verification Consumer

on:
  workflow_run:
    workflows: [NUSA Isolated Causal Verification]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: nusa-isolated-causal-consumer-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  verify-and-exercise-bounded-runner:
    if: >-
      ${{ github.repository == 'cinamoncandy/NUSA' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          github.event.workflow_run.event == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      # The submit step runs scripts/submit-isolated-causal-verification.js, so the trusted main source must be present.
      # Without this checkout the first real run (consumer 42789040136) failed with MODULE_NOT_FOUND before any request.
      - name: Checkout protected-main consumer source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download the signed bundle from this exact source run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nusa-isolated-causal-attestation-${{ github.event.workflow_run.run_attempt }}
          run-id: ${{ github.event.workflow_run.id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/nusa-isolated-causal-attestation

      - name: Request isolated verification through the OIDC-authenticated Worker
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          NUSA_ATTESTATION_BUNDLE: ${{ runner.temp }}/nusa-isolated-causal-attestation/attestation.json
          NUSA_VERIFICATION_RECEIPT: ${{ runner.temp }}/nusa-isolated-causal-verification-receipt.json
        run: node scripts/submit-isolated-causal-verification.js

      - name: Upload sanitized isolated verification receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: nusa-isolated-causal-verification-result-${{ github.event.workflow_run.run_attempt }}
          path: ${{ runner.temp }}/nusa-isolated-causal-verification-receipt.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
