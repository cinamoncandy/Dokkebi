name: NUSA Isolated Causal Verification Consumer

on:
  workflow_run:
    workflows: [NUSA Isolated Causal Verification]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: nusa-isolated-causal-consumer-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  verify-and-exercise-bounded-runner:
    if: >-
      ${{ github.repository == 'cinamoncandy/NUSA' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          github.event.workflow_run.event == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      checks: write
      contents: read
    steps:
      - name: Checkout the exact protected-main source run
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Enable pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile exact-source verifier and bounded CodingRunner
        run: pnpm exec tsc -p tsconfig.json

      - name: Download the signed bundle from this exact source run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nusa-isolated-causal-attestation-${{ github.event.workflow_run.run_attempt }}
          run-id: ${{ github.event.workflow_run.id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/nusa-isolated-causal-attestation

      - name: Cryptographically verify, classify, execute once, and reject replay
        env:
          GH_TOKEN: ${{ github.token }}
          NUSA_GITHUB_TOKEN: ${{ github.token }}
          NUSA_ATTESTATION_BUNDLE: ${{ runner.temp }}/nusa-isolated-causal-attestation/attestation.json
          NUSA_VERIFICATION_RECEIPT: ${{ runner.temp }}/nusa-isolated-causal-verification-receipt.json
        run: |
          node scripts/verify-isolated-causal-positive.js

      - name: Upload sanitized isolated verification receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nusa-isolated-causal-verification-result-${{ github.event.workflow_run.run_attempt }}
          path: ${{ runner.temp }}/nusa-isolated-causal-verification-receipt.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
