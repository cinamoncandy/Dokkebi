name: Autopilot Cloudflare Deploy

# Deploys the exact CI-verified Autopilot Worker revision. Autonomous coding validation runs on
# the canonical GitHub Actions execution consumer, so the Cloudflare deployment has no paid
# Containers dependency.

on:
  push:
    branches: [main]
    paths:
      - "apps/autopilot/**"
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      head_sha:
        description: "Exact main revision to deploy (used when GITHUB_TOKEN-dispatched CI completion cannot fire workflow_run)"
        required: true
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: nusa-autopilot-cloudflare-deploy
  cancel-in-progress: false

env:
  # Single source of truth for the deployed credit posture: the same value is passed to wrangler
  # and used to derive the health value the deployed Worker must report back. Hardcoding the
  # expectation separately is what let the deploy gate drift from the deployed var.
  NUSA_ZERO_CREDIT_MODE: "true"
  NUSA_WORKER_HEALTH_URL: https://nusa-autopilot.desporin12.workers.dev/health

jobs:
  deploy:
    name: Deploy exact CI-verified Worker revision
    if: >-
      ${{ github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch' ||
        (github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.head_branch == 'main' &&
         github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact CI-verified commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.event_name == 'workflow_dispatch' && inputs.head_sha || github.sha }}
          fetch-depth: 0

      - name: Wait for exact-head CI success before deploying
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.event_name == 'workflow_dispatch' && inputs.head_sha || github.sha }}
        run: |
          set -euo pipefail
          # One exact head can carry several CI runs: the push-triggered one and the
          # GITHUB_TOKEN-dispatched one that exists because a token-dispatched run fires no
          # workflow_run listeners. Concurrency cancels whichever loses the race. Reading a single
          # arbitrary run and failing closed on it therefore lets a cancelled duplicate veto a
          # deployment whose exact head did pass CI - which is what blocked e29be261.
          #
          # A cancelled run is the absence of a verdict, not a negative one. A failure still is one.
          for attempt in $(seq 1 30); do
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$HEAD_SHA&per_page=100" > /tmp/nusa-exact-head-ci.json
            verdict="$(HEAD_SHA="$HEAD_SHA" node - <<'NODE'
          const fs = require('fs');
          const pages = JSON.parse(fs.readFileSync('/tmp/nusa-exact-head-ci.json', 'utf8'));
          const expected = String(process.env.HEAD_SHA).toLowerCase();
          const runs = (Array.isArray(pages) ? pages.flatMap((page) => page?.workflow_runs || []) : [])
            .filter((run) => run?.name === 'CI'
              && run?.path === '.github/workflows/ci.yml'
              && String(run?.head_sha || '').toLowerCase() === expected);
          const conclusions = new Set(runs.map((run) => run?.conclusion));
          if (conclusions.has('success')) { console.log('success'); process.exit(0); }
          if (conclusions.has('failure') || conclusions.has('timed_out')) { console.log('failed'); process.exit(0); }
          console.log('pending');
          NODE
          )"
            if [ "$verdict" = "success" ]; then
              echo "Exact-head CI verified: $HEAD_SHA"
              exit 0
            fi
            if [ "$verdict" = "failed" ]; then
              echo "Exact-head CI failed for $HEAD_SHA"
              exit 1
            fi
            echo "Waiting for a decisive exact-head CI verdict on $HEAD_SHA (attempt $attempt/30)..."
            sleep 20
          done
          echo "Timed out waiting for exact-head CI on $HEAD_SHA"
          exit 1

      - name: Verify exact current main revision
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.event_name == 'workflow_dispatch' && inputs.head_sha || github.sha }}
        run: |
          set -euo pipefail
          current="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          if [ "$current" != "$HEAD_SHA" ]; then
            echo 'current=false' >> "$GITHUB_OUTPUT"
            echo "Skipping stale push ${HEAD_SHA}; current main is ${current}. A newer run will deploy it."
            exit 0
          fi
          echo 'current=true' >> "$GITHUB_OUTPUT"
          echo "Verified pushed revision is current main: $HEAD_SHA"

      - name: Determine whether exact main changes Worker runtime inputs
        id: deploy_scope
        if: steps.revision.outputs.current == 'true'
        env:
          HEAD_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.event_name == 'workflow_dispatch' && inputs.head_sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = 'workflow_dispatch' ] && [ "$ACTOR" != 'github-actions[bot]' ]; then
            echo 'worker_runtime_changed=true' >> "$GITHUB_OUTPUT"
            echo "Owner-initiated exact-head workflow_dispatch preserves the explicit deployment and secret-sync path."
            exit 0
          fi
          if ! [[ "$HEAD_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo '::error::Cannot determine Worker deploy scope from a malformed exact head.'
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/autopilot-cloudflare-deploy.yml/runs?branch=main&status=completed&per_page=100" > /tmp/nusa-worker-deploy-history.json
          baseline="$(GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_REPOSITORY="$GITHUB_REPOSITORY" node scripts/autopilot-worker-deploy-scope.js --last-successful-deployment < /tmp/nusa-worker-deploy-history.json)"
          if [ -z "$baseline" ]; then
            echo 'worker_runtime_changed=true' >> "$GITHUB_OUTPUT"
            echo 'No prior successful exact-main deployment evidence exists; preserving deployment path fail-safe.'
            exit 0
          fi
          if ! git merge-base --is-ancestor "$baseline" "$HEAD_SHA"; then
            echo '::error::Last successful deployment head is not an ancestor of this exact main revision; refusing to skip deployment.'
            exit 1
          fi
          git diff --no-renames --name-only -z "$baseline" "$HEAD_SHA" |
            node scripts/autopilot-worker-deploy-scope.js >> "$GITHUB_OUTPUT"
          if grep -q '^worker_runtime_changed=true$' "$GITHUB_OUTPUT"; then
            echo "Exact main $HEAD_SHA changes Worker runtime inputs since last successful deployment $baseline; normal CI and deployment gates remain required."
          else
            echo "Exact main $HEAD_SHA has no Worker runtime-input delta since last successful deployment $baseline; credentials are still verified and runtime secrets re-synchronized (a rotated credential must reach the live Worker), but the Worker deploy and its health verification are skipped."
          fi

      - name: Enable pnpm via Corepack
        if: steps.revision.outputs.current == 'true'
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.revision.outputs.current == 'true'
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        if: steps.revision.outputs.current == 'true'
        run: pnpm install --frozen-lockfile

      - name: Verify Cloudflare deployment credentials and account access
        if: steps.revision.outputs.current == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NUSA_AUTOPILOT_RUNTIME_TOKEN: ${{ secrets.NUSA_AUTOPILOT_RUNTIME_TOKEN }}
          NUSA_AUTOPILOT_GITHUB_TOKEN: ${{ secrets.NUSA_AUTOPILOT_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo '::error::CLOUDFLARE_API_TOKEN is not configured. HUMAN_ONLY blocker.'
            exit 1
          fi
          if ! [[ "${CLOUDFLARE_ACCOUNT_ID:-}" =~ ^[0-9a-fA-F]{32}$ ]]; then
            echo '::error::CLOUDFLARE_ACCOUNT_ID is missing or malformed. HUMAN_ONLY blocker.'
            exit 1
          fi
          if [ "${#NUSA_AUTOPILOT_RUNTIME_TOKEN}" -lt 32 ]; then
            echo '::error::NUSA_AUTOPILOT_RUNTIME_TOKEN is missing or shorter than 32 bytes. HUMAN_ONLY blocker.'
            exit 1
          fi
          if [ "${#NUSA_AUTOPILOT_GITHUB_TOKEN}" -lt 32 ]; then
            echo '::error::NUSA_AUTOPILOT_GITHUB_TOKEN is missing or shorter than 32 bytes. HUMAN_ONLY blocker.'
            exit 1
          fi
          if ! pnpm dlx wrangler@4.127.1 whoami --config apps/autopilot/wrangler.jsonc >/tmp/nusa-wrangler-whoami.log 2>&1; then
            cat /tmp/nusa-wrangler-whoami.log
            echo '::error::Cloudflare authentication/account preflight failed.'
            exit 1
          fi
          echo 'Cloudflare token/account/runtime-secret preflight passed; GitHub-secret preflight passed.'

      - name: Sync persistent Autopilot runtime bearer secret
        if: steps.revision.outputs.current == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NUSA_AUTOPILOT_RUNTIME_TOKEN: ${{ secrets.NUSA_AUTOPILOT_RUNTIME_TOKEN }}
        run: |
          set -euo pipefail
          [ "${#NUSA_AUTOPILOT_RUNTIME_TOKEN}" -ge 32 ] || { echo '::error::Autopilot runtime secret unavailable.'; exit 1; }
          printf '%s' "$NUSA_AUTOPILOT_RUNTIME_TOKEN" |
            pnpm dlx wrangler@4.127.1 secret put NUSA_AUTOPILOT_RUNTIME_TOKEN --config apps/autopilot/wrangler.jsonc >/tmp/nusa-runtime-secret-sync.log
          grep -q 'Success' /tmp/nusa-runtime-secret-sync.log || { cat /tmp/nusa-runtime-secret-sync.log; echo '::error::Cloudflare runtime-secret synchronization failed.'; exit 1; }
          echo 'Cloudflare Autopilot runtime secret synchronized without exposing token material.'

      - name: Sync Worker GitHub API credential
        if: steps.revision.outputs.current == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NUSA_AUTOPILOT_GITHUB_TOKEN: ${{ secrets.NUSA_AUTOPILOT_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [ "${#NUSA_AUTOPILOT_GITHUB_TOKEN}" -ge 32 ] || { echo '::error::Worker GitHub credential unavailable.'; exit 1; }
          printf '%s' "$NUSA_AUTOPILOT_GITHUB_TOKEN" |
            pnpm dlx wrangler@4.127.1 secret put NUSA_GITHUB_TOKEN --config apps/autopilot/wrangler.jsonc >/tmp/nusa-github-secret-sync.log
          grep -q 'Success' /tmp/nusa-github-secret-sync.log || { cat /tmp/nusa-github-secret-sync.log; echo '::error::Worker GitHub credential synchronization failed.'; exit 1; }
          echo 'Worker GitHub API credential synchronized without exposing token material.'

      - name: Deploy exact CI-verified revision to Cloudflare Workers Free-compatible runtime
        if: steps.revision.outputs.current == 'true' && steps.deploy_scope.outputs.worker_runtime_changed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HEAD_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.event_name == 'workflow_dispatch' && inputs.head_sha || github.sha }}
        run: |
          set -euo pipefail
          case "${NUSA_ZERO_CREDIT_MODE:-}" in
            true|false) ;;
            *) echo '::error::ZERO_CREDIT_POSTURE_INVALID'; exit 1 ;;
          esac
          pnpm dlx wrangler@4.127.1 deploy \
            --config apps/autopilot/wrangler.jsonc \
            --var "NUSA_DEPLOYMENT_REVISION:${HEAD_SHA}" \
            --var "NUSA_AUTOPILOT_ZERO_CREDIT_MODE:${NUSA_ZERO_CREDIT_MODE}" \
            --var "NUSA_AUTOPILOT_PAID_OVERFLOW_DAILY_CAP:25" \
            --var "NUSA_JEV_SHADOW_ENABLED:true" \
            --var "NUSA_JEV_BOUNDED_ROUTING_ENABLED:false"

      - name: Verify deployed Worker reports the exact-head revision and fail-closed authority
        if: steps.revision.outputs.current == 'true' && steps.deploy_scope.outputs.worker_runtime_changed == 'true'
        env:
          HEAD_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.event_name == 'workflow_dispatch' && inputs.head_sha || github.sha }}
        run: |
          set -euo pipefail
          case "${NUSA_ZERO_CREDIT_MODE:-}" in
            true|false) ;;
            *) echo '::error::ZERO_CREDIT_POSTURE_INVALID'; exit 1 ;;
          esac
          expected_zero_credit="DISABLED"
          if [ "${NUSA_ZERO_CREDIT_MODE}" = "true" ]; then expected_zero_credit="ENFORCED"; fi
          echo "Expecting deployed zeroCreditMode=${expected_zero_credit}"
          for attempt in $(seq 1 15); do
            health="$(curl -sS --fail-with-body --max-time 20 "$NUSA_WORKER_HEALTH_URL" || true)"
            revision="$(printf '%s' "$health" | jq -r '.deploymentRevision // empty' 2>/dev/null || true)"
            live="$(printf '%s' "$health" | jq -r '.liveAuthority // empty' 2>/dev/null || true)"
            mutation="$(printf '%s' "$health" | jq -r 'if has("productionMutationAllowed") then (.productionMutationAllowed | tostring) else empty end' 2>/dev/null || true)"
            ai="$(printf '%s' "$health" | jq -r '.aiAuthority // empty' 2>/dev/null || true)"
            zero_credit="$(printf '%s' "$health" | jq -r '.zeroCreditMode // empty' 2>/dev/null || true)"
            if [ "$revision" = "$HEAD_SHA" ] && [ "$live" = "NONE" ] && [ "$mutation" = "false" ] && [ "$ai" = "ZERO_AUTHORITY" ] && [ "$zero_credit" = "$expected_zero_credit" ]; then
              echo "Verified deployed Worker revision and safety invariants: $revision"
              exit 0
            fi
            echo "Waiting for exact safe Worker revision ${HEAD_SHA} (currently ${revision:-unknown}), attempt $attempt/15..."
            sleep 10
          done
          echo "::error::Worker health never reported the exact safe deployed revision ${HEAD_SHA}. Failing closed."
          exit 1

      - name: Dispatch Runtime Proof directly for token-dispatched fallback deploy
        if: steps.revision.outputs.current == 'true' && steps.deploy_scope.outputs.worker_runtime_changed == 'true' && github.event_name == 'workflow_dispatch' && github.actor == 'github-actions[bot]'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Normal push/workflow_run Deploy completions already feed Runtime Proof through its
          # workflow_run ingress. Only a GITHUB_TOKEN-authenticated workflow_dispatch needs the
          # direct fallback because that token-originated completion does not reliably create a
          # downstream workflow_run. Keep exactly one producer for the normal convergence path.
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/autopilot-cloudflare-runtime-proof.yml/dispatches" -f ref=main
          echo "Dispatched Autopilot Cloudflare Runtime Proof for token-dispatched exact-main deploy fallback."

      - name: Record fail-closed authority invariants
        if: always()
        run: |
          echo 'liveAuthority=NONE'
          echo 'productionMutationAllowed=false'
          echo 'AI authority=ZERO_AUTHORITY'
