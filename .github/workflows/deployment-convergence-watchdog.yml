name: Deployment Convergence Watchdog

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: deployment-convergence-watchdog
  cancel-in-progress: true

jobs:
  reconcile:
    name: Reconcile latest protected main deployment
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout trusted main watchdog
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Reconcile exact-main deployment chain
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          printf '%s' "$MAIN_SHA" | grep -Eq '^[0-9a-fA-F]{40}$'
          echo "Reconciling exact-main deployment for $MAIN_SHA"

          current_main() {
            gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha'
          }

          assert_still_current() {
            local now
            now="$(current_main)"
            if [ "$now" != "$MAIN_SHA" ]; then
              echo "Main advanced from $MAIN_SHA to $now; newer watchdog cycle owns convergence."
              exit 0
            fi
          }

          runs_for_main() {
            gh api --paginate \
              "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$MAIN_SHA&per_page=100" \
              --jq '.workflow_runs[]' | jq -s '{workflow_runs: .}'
          }

          workflow_success() {
            local workflow_name="$1"
            printf '%s' "$RUNS_JSON" | jq -e --arg name "$workflow_name" --arg sha "$MAIN_SHA" '
              any(.workflow_runs[];
                .name == $name and .head_sha == $sha and
                .status == "completed" and .conclusion == "success")
            ' >/dev/null
          }

          workflow_active() {
            local workflow_name="$1"
            printf '%s' "$RUNS_JSON" | jq -e --arg name "$workflow_name" --arg sha "$MAIN_SHA" '
              any(.workflow_runs[];
                .name == $name and .head_sha == $sha and
                (.status == "queued" or .status == "in_progress" or .status == "pending"))
            ' >/dev/null
          }

          workflow_failures() {
            local workflow_name="$1"
            printf '%s' "$RUNS_JSON" | jq -r --arg name "$workflow_name" --arg sha "$MAIN_SHA" '
              [.workflow_runs[] |
                select(.name == $name and .head_sha == $sha and
                  .status == "completed" and
                  (.conclusion == "failure" or .conclusion == "timed_out" or .conclusion == "cancelled"))] |
              length
            '
          }

          latest_oracle_release() {
            printf '%s' "$RUNS_JSON" | jq -c --arg sha "$MAIN_SHA" '
              [.workflow_runs[] |
                select(.name == "Oracle PAPER Release" and
                  .path == ".github/workflows/oracle-paper-release.yml" and
                  .head_branch == "main" and .head_sha == $sha)] |
              sort_by(.run_started_at // .created_at) | last // empty
            '
          }

          oracle_release_success() {
            local run
            run="$(latest_oracle_release)"
            [ -n "$run" ] || return 1
            printf '%s' "$run" | jq -e '
              .status == "completed" and .conclusion == "success" and
              (.run_attempt | type) == "number" and .run_attempt >= 1
            ' >/dev/null
          }

          latest_post_release_host_diagnose() {
            local release
            release="$(latest_oracle_release)"
            [ -n "$release" ] || return 1
            printf '%s' "$RUNS_JSON" | jq -c --arg sha "$MAIN_SHA" --arg release_done "$(printf '%s' "$release" | jq -r '.updated_at // empty')" '
              [.workflow_runs[] |
                select(.name == "Oracle Host Diagnose" and
                  .path == ".github/workflows/oracle-host-diagnose.yml" and
                  .head_branch == "main" and .head_sha == $sha and
                  ((.run_started_at // .created_at) > $release_done))] |
              sort_by(.run_started_at // .created_at) | last // empty
            '
          }

          oracle_host_diagnose_success() {
            local run
            run="$(latest_post_release_host_diagnose)"
            [ -n "$run" ] || return 1
            printf '%s' "$run" | jq -e '
              .status == "completed" and .conclusion == "success" and
              (.run_attempt | type) == "number" and .run_attempt >= 1
            ' >/dev/null
          }

          surface_incident() {
            local component="$1"
            local detail="$2"
            local title="Deployment convergence blocked: ${component} ${MAIN_SHA:0:8}"
            local existing
            existing="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
            if [ -z "$existing" ]; then
              gh issue create \
                --title "$title" \
                --body "Exact-main deployment convergence is blocked for $MAIN_SHA. Component: $component. $detail Automatic retries are bounded and have stopped for this component. Safety remains PAPER/SHADOW only; liveAuthority=NONE; productionMutationAllowed=false; aiAuthority=ZERO_AUTHORITY."
            fi
          }

          dispatch_bounded() {
            local component="$1"
            local workflow_name="$2"
            local workflow_file="$3"
            shift 3

            if workflow_success "$workflow_name"; then
              echo "$component already has exact-main SUCCESS."
              return 0
            fi
            if workflow_active "$workflow_name"; then
              echo "$component already has an active exact-main run."
              return 0
            fi

            local failures
            failures="$(workflow_failures "$workflow_name")"
            if [ "$failures" -ge 3 ]; then
              surface_incident "$component" "Observed $failures failed/timed-out/cancelled exact-main runs."
              echo "$component retry budget exhausted; remaining fail-closed."
              return 0
            fi

            assert_still_current
            echo "Dispatching $component convergence attempt $((failures + 1))/3."
            gh api --method POST \
              "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_file/dispatches" \
              -f ref=main "$@"
          }

          CI_CONCLUSION="$(
            gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$MAIN_SHA&status=completed&per_page=100" \
              --jq '[.workflow_runs[] | select(.name == "CI" and .path == ".github/workflows/ci.yml" and .head_sha == "'"$MAIN_SHA"'" and .conclusion == "success")][0].conclusion // empty'
          )"
          if [ "$CI_CONCLUSION" != "success" ]; then
            echo "Exact-main CI has no successful attempt yet; deployment convergence remains fail-closed."
            exit 0
          fi

          assert_still_current
          RUNS_JSON="$(runs_for_main)"

          # Repair the canonical one-shot handoff failure mode first. Each downstream
          # workflow independently re-verifies current main and exact-head CI.
          dispatch_bounded \
            "Cloudflare Deploy" \
            "Autopilot Cloudflare Deploy" \
            "autopilot-cloudflare-deploy.yml" \
            -f "inputs[head_sha]=$MAIN_SHA"

          dispatch_bounded \
            "Actual PAPER Runtime" \
            "Actual PAPER Public-Market Runtime Evidence" \
            "wo-0059-actual-paper-runtime.yml"

          # Refresh observations after dispatches so later components do not race a
          # just-started prerequisite.
          RUNS_JSON="$(runs_for_main)"

          if workflow_success "Autopilot Cloudflare Deploy"; then
            dispatch_bounded \
              "Cloudflare Promote" \
              "Autopilot Cloudflare Promote" \
              "autopilot-cloudflare-promote.yml" \
              -f "inputs[head_sha]=$MAIN_SHA"
          else
            echo "Cloudflare Promote waits for exact-main Cloudflare Deploy success."
          fi

          RUNS_JSON="$(runs_for_main)"
          if workflow_success "Autopilot Cloudflare Deploy" && workflow_success "Autopilot Cloudflare Promote"; then
            dispatch_bounded \
              "Runtime Proof" \
              "Autopilot Cloudflare Runtime Proof" \
              "autopilot-cloudflare-runtime-proof.yml"
          else
            echo "Runtime Proof waits for exact-main Deploy + Promote success."
          fi

          ANDROID_TARGET="$(gh release view nusa-android --json targetCommitish --jq '.targetCommitish' 2>/dev/null || true)"
          if [ "$ANDROID_TARGET" != "$MAIN_SHA" ]; then
            RUNS_JSON="$(runs_for_main)"
            ANDROID_RUNS_JSON="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/342016298/runs?branch=main&per_page=100")"
            PUBLISHED_RUN=""
            for candidate in $(printf '%s' "$ANDROID_RUNS_JSON" | jq -r --arg sha "$MAIN_SHA" '[.workflow_runs[] | select(.head_sha == $sha and .status == "completed" and .conclusion == "success")][0:5] | .[].id'); do
              if [ "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$candidate/jobs?per_page=30" --jq '[.jobs[] | select(.name | test("publish"; "i")) | .conclusion] | map(select(. == "success")) | length')" -gt 0 ]; then
                PUBLISHED_RUN="$candidate"
                break
              fi
            done
            if workflow_active "Android Stable Release" || workflow_active "Android Stable Release Trigger"; then
              echo "Android exact-main convergence already active."
            elif [ -n "$PUBLISHED_RUN" ]; then
              echo "Android release run $PUBLISHED_RUN published on exact main, but the stable target is not visible yet; refusing a duplicate convergence trigger."
            else
              ANDROID_FAILURES="$(workflow_failures "Android Stable Release")"
              if [ "$ANDROID_FAILURES" -ge 3 ]; then
                surface_incident "Android Stable" "Observed $ANDROID_FAILURES failed/timed-out/cancelled exact-main stable runs."
                echo "Android retry budget exhausted; remaining fail-closed."
              else
                assert_still_current
                echo "Android stable target ${ANDROID_TARGET:-none} is stale; dispatching convergence trigger within stable retry budget $((ANDROID_FAILURES + 1))/3."
                gh api --method POST \
                  "repos/$GITHUB_REPOSITORY/actions/workflows/android-stable-release-trigger.yml/dispatches" \
                  -f ref=main
              fi
            fi
          else
            echo "Android stable already targets exact main."
          fi

          WINDOWS_TARGET="$(gh release view nusa-windows --json targetCommitish --jq '.targetCommitish' 2>/dev/null || true)"
          if [ "$WINDOWS_TARGET" != "$MAIN_SHA" ]; then
            RUNS_JSON="$(runs_for_main)"
            dispatch_bounded \
              "Windows Stable" \
              "Windows Desktop Stable Release" \
              "windows-desktop-stable-release.yml" \
              -f "inputs[source_sha]=$MAIN_SHA"
          else
            echo "Windows stable already targets exact main."
          fi

          # A single machine-readable convergence receipt is emitted only after all
          # exact-main runtime and distribution surfaces independently prove success.
          RUNS_JSON="$(runs_for_main)"
          ANDROID_TARGET="$(gh release view nusa-android --json targetCommitish --jq '.targetCommitish' 2>/dev/null || true)"
          WINDOWS_TARGET="$(gh release view nusa-windows --json targetCommitish --jq '.targetCommitish' 2>/dev/null || true)"

          if workflow_success "Autopilot Cloudflare Deploy" \
            && workflow_success "Autopilot Cloudflare Promote" \
            && workflow_success "Autopilot Cloudflare Runtime Proof" \
            && workflow_success "Actual PAPER Public-Market Runtime Evidence" \
            && workflow_success "Android Stable Release" \
            && workflow_success "Windows Desktop Stable Release" \
            && [ "$ANDROID_TARGET" = "$MAIN_SHA" ] \
            && [ "$WINDOWS_TARGET" = "$MAIN_SHA" ]; then
            if ! oracle_release_success; then
              LATEST_RELEASE="$(latest_oracle_release)"
              if [ -n "$LATEST_RELEASE" ]; then
                RELEASE_STATUS="$(printf '%s' "$LATEST_RELEASE" | jq -r '.status // "unknown"')"
                RELEASE_CONCLUSION="$(printf '%s' "$LATEST_RELEASE" | jq -r '.conclusion // "none"')"
                RELEASE_ID="$(printf '%s' "$LATEST_RELEASE" | jq -r '.id // "unknown"')"
                RELEASE_ATTEMPT="$(printf '%s' "$LATEST_RELEASE" | jq -r '.run_attempt // "unknown"')"
                echo "Convergence receipt waits for the latest exact-main Oracle PAPER Release to complete successfully (run $RELEASE_ID, attempt $RELEASE_ATTEMPT, status $RELEASE_STATUS, conclusion $RELEASE_CONCLUSION). No Release is dispatched by the watchdog."
                if [ "$RELEASE_STATUS" = "completed" ]; then
                  surface_incident "Oracle PAPER Release" "Latest exact-main run $RELEASE_ID attempt $RELEASE_ATTEMPT concluded $RELEASE_CONCLUSION. The watchdog will not dispatch a Release; use the existing governed manual Release path after investigation."
                fi
              else
                echo "Convergence receipt waits for an exact-main Oracle PAPER Release. No Release is dispatched by the watchdog."
                surface_incident "Oracle PAPER Release" "No exact-main Oracle PAPER Release is available for $MAIN_SHA. The watchdog does not dispatch a Release; use the existing governed manual Release path."
              fi
            elif ! oracle_host_diagnose_success; then
              LATEST_DIAGNOSE="$(latest_post_release_host_diagnose || true)"
              if [ -n "$LATEST_DIAGNOSE" ]; then
                DIAGNOSE_STATUS="$(printf '%s' "$LATEST_DIAGNOSE" | jq -r '.status // "unknown"')"
                DIAGNOSE_CONCLUSION="$(printf '%s' "$LATEST_DIAGNOSE" | jq -r '.conclusion // "none"')"
                DIAGNOSE_ID="$(printf '%s' "$LATEST_DIAGNOSE" | jq -r '.id // "unknown"')"
                DIAGNOSE_ATTEMPT="$(printf '%s' "$LATEST_DIAGNOSE" | jq -r '.run_attempt // "unknown"')"
                echo "Convergence receipt waits for the latest post-Release Oracle Host Diagnose to complete successfully (run $DIAGNOSE_ID, attempt $DIAGNOSE_ATTEMPT, status $DIAGNOSE_STATUS, conclusion $DIAGNOSE_CONCLUSION). Host Diagnose remains read-only and manual."
                if [ "$DIAGNOSE_STATUS" = "completed" ]; then
                  surface_incident "Oracle Host Diagnose" "Post-Release read-only Host Diagnose run $DIAGNOSE_ID attempt $DIAGNOSE_ATTEMPT concluded $DIAGNOSE_CONCLUSION. Convergence remains fail-closed until fresh matching host evidence is available."
                fi
              else
                echo "Convergence receipt waits for a fresh read-only Oracle Host Diagnose started after the successful Release. The watchdog does not access or mutate the host."
                RELEASE_ID="$(latest_oracle_release | jq -r '.id // "unknown"')"
                RELEASE_ATTEMPT="$(latest_oracle_release | jq -r '.run_attempt // "unknown"')"
                surface_incident "Oracle Host Diagnose" "No successful post-Release read-only Host Diagnose is available after Oracle Release run $RELEASE_ID attempt $RELEASE_ATTEMPT. The watchdog does not dispatch or access the host."
              fi
            else
              dispatch_bounded \
                "Deployment Receipt" \
                "Deployment Convergence Receipt" \
                "deployment-convergence-receipt.yml" \
                -f "inputs[source_sha]=$MAIN_SHA"
            fi
          else
            echo "Convergence receipt waits for all exact-main runtime and stable distribution proofs."
          fi

          assert_still_current
          echo "Convergence pass complete for $MAIN_SHA. Any newly dispatched prerequisite is verified on the next bounded cycle."
          echo 'liveAuthority=NONE'
          echo 'productionMutationAllowed=false'
          echo 'aiAuthority=ZERO_AUTHORITY'
