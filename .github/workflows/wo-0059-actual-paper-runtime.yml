name: Actual PAPER Public-Market Runtime Evidence

on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wo-0059-actual-paper-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  actual-paper-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Enable pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - name: Workflow action supply-chain pins
        run: node scripts/validate-workflow-action-pins.js
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build exact PR head
        run: pnpm run build
      - name: Assert PAPER-only external runtime boundary
        env:
          NUSA_LIVE_MUTATION: PROHIBITED
        run: |
          test "$NUSA_LIVE_MUTATION" = "PROHIBITED"
          echo 'WO-0059: Upbit PUBLIC market data only; no private exchange credentials or LIVE broker endpoint is configured.'
      - name: Select a naturally actionable Upbit PUBLIC market when one exists
        id: paper-market
        run: node scripts/select-actual-paper-e2e-market.js >> "$GITHUB_OUTPUT"
      - name: Run actual Cloud PAPER E2E against Upbit PUBLIC ticker
        env:
          NUSA_MODE: PAPER
          NUSA_LIVE_MUTATION: PROHIBITED
          NUSA_E2E_MARKET: ${{ steps.paper-market.outputs.market }}
          NUSA_PAPER_CHAOS_E2E_NON_MUTATING: "true"
        run: node scripts/actual-paper-runtime-e2e.js --working-dir "${{ runner.temp }}/nusa-wo-0059" --output artifacts/operational-evidence/actual-paper-runtime-e2e.json
      - name: Classify autonomous PAPER completion without manufacturing a signal
        run: node scripts/classify-actual-paper-runtime-readiness.js artifacts/operational-evidence/actual-paper-runtime-e2e.json
      - name: Upload legacy-name Actual PAPER runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wo-0059-actual-paper-runtime-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/operational-evidence/actual-paper-runtime-e2e.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload attempt-scoped Actual PAPER runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wo-0059-actual-paper-runtime-evidence-${{ github.event.pull_request.head.sha || github.sha }}-attempt-${{ github.run_attempt }}
          path: artifacts/operational-evidence/actual-paper-runtime-e2e.json
          if-no-files-found: error
          retention-days: 14

  dispatch-readiness-convergence:
    needs: actual-paper-runtime
    if: always() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor == 'github-actions[bot]' && github.triggering_actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      CALLBACK_ACTOR: ${{ github.actor }}
      CALLBACK_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
    steps:
      - name: Dispatch one exact-source convergence evaluation
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$CALLBACK_ACTOR" = "github-actions[bot]"
          test "$CALLBACK_TRIGGERING_ACTOR" = "github-actions[bot]"
          [[ "$GITHUB_SHA" =~ ^[a-fA-F0-9]{40}$ ]]
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          payload="$(jq -n \
            --arg sha "$GITHUB_SHA" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            '{ref:"main",inputs:{target_sha:$sha,source_run_id:$run_id,source_run_attempt:$run_attempt}}')"
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/actions/workflows/exact-head-paper-readiness-convergence.yml/dispatches" \
            --input - <<<"$payload"
          echo "Dispatched exact-main readiness evaluation for source run $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT at $GITHUB_SHA"
