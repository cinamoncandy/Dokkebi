name: Autopilot Deterministic Audit Release
run-name: ${{ github.event.client_payload.dedupe_key || 'invalid-audit-identity' }}

on:
  repository_dispatch:
    types: [nusa_autopilot_audit]

permissions: {}

concurrency:
  group: deterministic-audit-release-${{ github.event.client_payload.dedupe_key }}
  cancel-in-progress: false

jobs:
  audit:
    if: ${{ github.event.client_payload.kind == 'AUDIT_REQUEST' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    outputs:
      applicable: ${{ steps.audit.outputs.applicable }}
      authority: ${{ steps.audit.outputs.authority }}
      audited_base: ${{ steps.audit.outputs.audited_base }}
    steps:
      - name: Validate and bind deterministic Audit authority
        id: audit
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.client_payload.pr_number }}
          REQUESTED_HEAD: ${{ github.event.client_payload.head_sha }}
          WORKFLOW_RUN_ID: ${{ github.event.client_payload.workflow_run_id }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nusa-deterministic-audit"

          node - <<'NODE'
          const fs = require('fs');
          const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const p = event.client_payload || {};
          const fail = (m) => { console.error(m); process.exit(1); };
          if (p.kind !== 'AUDIT_REQUEST') fail('unexpected Audit request kind');
          if (p.repository !== process.env.GITHUB_REPOSITORY) fail('repository mismatch');
          if (!Number.isSafeInteger(p.pr_number) || p.pr_number <= 0) fail('invalid PR number');
          if (!/^[0-9a-f]{40}$/i.test(p.head_sha || '')) fail('invalid exact head SHA');
          if (!Number.isSafeInteger(p.workflow_run_id) || p.workflow_run_id <= 0) fail('invalid CI run id');
          if (p.live_authority !== 'NONE') fail('liveAuthority must remain NONE');
          if (p.production_mutation_allowed !== false) fail('productionMutationAllowed must remain false');
          if (p.ai_authority !== 'ZERO_AUTHORITY') fail('aiAuthority must remain ZERO_AUTHORITY');
          NODE

          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$RUNNER_TEMP/nusa-deterministic-audit/pr.json"
          gh api "repos/$GITHUB_REPOSITORY/branches/main" > "$RUNNER_TEMP/nusa-deterministic-audit/main.json"

          current_state="$(jq -r '.state' "$RUNNER_TEMP/nusa-deterministic-audit/pr.json")"
          current_draft="$(jq -r '.draft // false' "$RUNNER_TEMP/nusa-deterministic-audit/pr.json")"
          current_head="$(jq -r '.head.sha // empty' "$RUNNER_TEMP/nusa-deterministic-audit/pr.json")"
          current_base="$(jq -r '.base.sha // empty' "$RUNNER_TEMP/nusa-deterministic-audit/pr.json")"
          base_ref="$(jq -r '.base.ref // empty' "$RUNNER_TEMP/nusa-deterministic-audit/pr.json")"
          base_repo="$(jq -r '.base.repo.full_name // empty' "$RUNNER_TEMP/nusa-deterministic-audit/pr.json")"
          current_main="$(jq -r '.commit.sha // empty' "$RUNNER_TEMP/nusa-deterministic-audit/main.json")"
          current_hold="$(jq -r '
            if (.labels | type) != "array" then "invalid"
            elif any(.labels[]; (.name | type) != "string") then "invalid"
            elif any(.labels[]; (.name | ascii_downcase) == "hold") then "true"
            else "false"
            end
          ' "$RUNNER_TEMP/nusa-deterministic-audit/pr.json")"

          if [ "$current_state" != "open" ] || [ "$current_draft" = "true" ] || [ "$current_hold" != "false" ] || [ "$current_head" != "$REQUESTED_HEAD" ] || [ "$base_ref" != "main" ] || [ "$base_repo" != "$GITHUB_REPOSITORY" ] || [ "$current_base" != "$current_main" ]; then
            echo 'applicable=false' >> "$GITHUB_OUTPUT"
            echo 'authority=NONE' >> "$GITHUB_OUTPUT"
            echo "audited_base=$current_main" >> "$GITHUB_OUTPUT"
            echo "NO_ACTION stale/non-releasable Audit request: state=$current_state draft=$current_draft hold=$current_hold requested_head=$REQUESTED_HEAD current_head=$current_head base=$current_base main=$current_main"
            exit 0
          fi

          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" > "$RUNNER_TEMP/nusa-deterministic-audit/open-issues-pages.json"
          PR_JSON="$(cat "$RUNNER_TEMP/nusa-deterministic-audit/pr.json")" node - <<'NODE'
          const fs = require('fs');
          const pages = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/nusa-deterministic-audit/open-issues-pages.json`, 'utf8'));
          const pull = JSON.parse(process.env.PR_JSON);
          const openIssues = Array.isArray(pages) ? pages.flat() : [];
          const critical = openIssues
            .filter((issue) => !issue?.pull_request && issue?.state === 'open' && /^P0(?:\s|:)/i.test(String(issue?.title || '')) && /\bRefs\s+#903\b/i.test(String(issue?.body || '')))
            .sort((a, b) => String(a?.created_at || '').localeCompare(String(b?.created_at || '')) || Number(a?.number || 0) - Number(b?.number || 0));
          if (critical.length === 0) process.exit(0);
          const active = critical[0];
          const closesActive = new RegExp(`(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\\s+#${active.number}\\b`, 'i').test(String(pull.body || ''));
          if (closesActive) process.exit(0);
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/nusa-deterministic-audit/release-serialization-block.json`, JSON.stringify({ issueNumber: Number(active.number) }));
          NODE

          if [ -f "$RUNNER_TEMP/nusa-deterministic-audit/release-serialization-block.json" ]; then
            blocked_issue="$(jq -r '.issueNumber' "$RUNNER_TEMP/nusa-deterministic-audit/release-serialization-block.json")"
            echo 'applicable=false' >> "$GITHUB_OUTPUT"
            echo 'authority=NONE' >> "$GITHUB_OUTPUT"
            echo "audited_base=$current_main" >> "$GITHUB_OUTPUT"
            echo "NO_ACTION Release serialized before Audit: blocked_by=P0#$blocked_issue pr=$PR_NUMBER head=$REQUESTED_HEAD"
            exit 0
          fi

          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$WORKFLOW_RUN_ID" > "$RUNNER_TEMP/nusa-deterministic-audit/ci.json"
          jq -e --arg head "$REQUESTED_HEAD" --arg repo "$GITHUB_REPOSITORY" '
            .name == "CI" and .path == ".github/workflows/ci.yml" and .event == "pull_request" and
            .status == "completed" and .conclusion == "success" and .head_sha == $head and .repository.full_name == $repo
          ' "$RUNNER_TEMP/nusa-deterministic-audit/ci.json" >/dev/null

          required_workflows=(
            "CI"
            "Actual PAPER Public-Market Runtime Evidence"
            "Read-only Broker Credential Integration"
            "Restricted LIVE Capability Surface Guard"
            "Restricted LIVE Transport Credential Readiness"
            "Restricted LIVE Activation Rehearsal"
          )
          required_ready=false
          for poll in $(seq 1 30); do
            gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$REQUESTED_HEAD&event=pull_request&per_page=100" > "$RUNNER_TEMP/nusa-deterministic-audit/exact-head-runs.json"
            required_ready=true
            for required in "${required_workflows[@]}"; do
              conclusion="$(jq -r --arg name "$required" --arg head "$REQUESTED_HEAD" '[.workflow_runs[] | select(.name == $name and .head_sha == $head)] | sort_by(.updated_at) | reverse | .[0].conclusion // empty' "$RUNNER_TEMP/nusa-deterministic-audit/exact-head-runs.json")"
              if [ "$conclusion" != "success" ]; then
                required_ready=false
                echo "Waiting for exact-head workflow: $required (conclusion=${conclusion:-pending}, poll $poll/30)"
              fi
            done
            if [ "$required_ready" = "true" ]; then break; fi
            sleep 10
          done
          if [ "$required_ready" != "true" ]; then
            echo "Required exact-head workflows did not converge to success before the bounded Audit deadline." >&2
            exit 1
          fi

          paper_run_id="$(jq -r --arg head "$REQUESTED_HEAD" '[.workflow_runs[] | select(.name == "Actual PAPER Public-Market Runtime Evidence" and .path == ".github/workflows/wo-0059-actual-paper-runtime.yml" and .head_sha == $head and .event == "pull_request" and .status == "completed" and .conclusion == "success")] | sort_by(.updated_at) | reverse | .[0].id // empty' "$RUNNER_TEMP/nusa-deterministic-audit/exact-head-runs.json")"
          test -n "$paper_run_id"
          paper_run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$paper_run_id")"
          jq -e --arg head "$REQUESTED_HEAD" --arg repo "$GITHUB_REPOSITORY" '.name == "Actual PAPER Public-Market Runtime Evidence" and .path == ".github/workflows/wo-0059-actual-paper-runtime.yml" and .event == "pull_request" and .status == "completed" and .conclusion == "success" and .head_sha == $head and .repository.full_name == $repo' <<<"$paper_run" >/dev/null

          paper_artifact_name="wo-0059-actual-paper-runtime-evidence-$REQUESTED_HEAD"
          paper_artifacts="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$paper_run_id/artifacts?per_page=100")"
          paper_artifact="$(jq -c --arg name "$paper_artifact_name" --arg head "$REQUESTED_HEAD" '[.artifacts[] | select(.name == $name and .expired == false and .workflow_run.head_sha == $head and (.digest | type == "string" and test("^sha256:[a-fA-F0-9]{64}$")))] | sort_by(.updated_at) | reverse | .[0] // empty' <<<"$paper_artifacts")"
          test -n "$paper_artifact"
          paper_artifact_id="$(jq -r '.id' <<<"$paper_artifact")"
          paper_artifact_digest="$(jq -r '.digest' <<<"$paper_artifact")"
          mkdir -p "$RUNNER_TEMP/nusa-deterministic-audit/paper"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$paper_artifact_id/zip" > "$RUNNER_TEMP/nusa-deterministic-audit/paper.zip"
          unzip -q "$RUNNER_TEMP/nusa-deterministic-audit/paper.zip" -d "$RUNNER_TEMP/nusa-deterministic-audit/paper"
          paper_evidence="$(find "$RUNNER_TEMP/nusa-deterministic-audit/paper" -type f -name 'actual-paper-runtime-e2e.json' -print -quit)"
          test -n "$paper_evidence"
          paper_validator="$RUNNER_TEMP/nusa-deterministic-audit/validate-deterministic-paper-audit-evidence.js"
          gh api "repos/$GITHUB_REPOSITORY/contents/scripts/validate-deterministic-paper-audit-evidence.js?ref=$current_main" --jq '.content' | base64 --decode > "$paper_validator"
          node "$paper_validator" "$paper_evidence" "$REQUESTED_HEAD" "$paper_run_id" "$paper_artifact_id" "$paper_artifact_name" "$paper_artifact_digest"

          final_pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          final_main="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          final_state="$(jq -r '.state' <<<"$final_pr")"
          final_draft="$(jq -r '.draft // false' <<<"$final_pr")"
          final_head="$(jq -r '.head.sha' <<<"$final_pr")"
          final_base="$(jq -r '.base.sha' <<<"$final_pr")"
          final_hold="$(jq -r 'if (.labels | type) != "array" then "invalid" elif any(.labels[]; (.name | type) != "string") then "invalid" elif any(.labels[]; (.name | ascii_downcase) == "hold") then "true" else "false" end' <<<"$final_pr")"
          test "$final_state" = "open"
          test "$final_draft" = "false"
          test "$final_hold" = "false"
          test "$final_head" = "$REQUESTED_HEAD"
          test "$final_base" = "$current_main"
          test "$final_main" = "$current_main"
          echo 'applicable=true' >> "$GITHUB_OUTPUT"
          echo 'authority=DETERMINISTIC_AUDIT_PASS' >> "$GITHUB_OUTPUT"
          echo "audited_base=$current_main" >> "$GITHUB_OUTPUT"
          echo "Deterministic Audit PASS: pr=$PR_NUMBER head=$REQUESTED_HEAD base=$current_main ci=$WORKFLOW_RUN_ID paper_run=$paper_run_id paper_artifact=$paper_artifact_id"
          echo 'liveAuthority=NONE'
          echo 'productionMutationAllowed=false'
          echo 'aiAuthority=ZERO_AUTHORITY'

  release:
    needs: audit
    if: ${{ needs.audit.result == 'success' && needs.audit.outputs.applicable == 'true' && needs.audit.outputs.authority == 'DETERMINISTIC_AUDIT_PASS' }}
    runs-on: ubuntu-latest
    environment: nusa-release-authority
    timeout-minutes: 20
    concurrency:
      group: deterministic-release-main
      cancel-in-progress: false
    permissions:
      actions: write
      contents: read
      issues: read
      pull-requests: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.client_payload.pr_number }}
      EXPECTED_HEAD: ${{ github.event.client_payload.head_sha }}
      AUDITED_BASE: ${{ needs.audit.outputs.audited_base }}
    steps:
      - name: Re-verify expected head and audited base
        run: |
          set -euo pipefail
          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          main="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          release_hold="$(jq -r 'if (.labels | type) != "array" then "invalid" elif any(.labels[]; (.name | type) != "string") then "invalid" elif any(.labels[]; (.name | ascii_downcase) == "hold") then "true" else "false" end' <<<"$pr")"
          test "$(jq -r '.state' <<<"$pr")" = "open"
          test "$(jq -r '.draft // false' <<<"$pr")" = "false"
          test "$release_hold" = "false"
          test "$(jq -r '.head.sha' <<<"$pr")" = "$EXPECTED_HEAD"
          test "$(jq -r '.base.ref' <<<"$pr")" = "main"
          test "$(jq -r '.base.sha' <<<"$pr")" = "$AUDITED_BASE"
          test "$main" = "$AUDITED_BASE"

      - name: Enforce canonical P0 Release serialization
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" > "$RUNNER_TEMP/nusa-release-open-issues-pages.json"
          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          PR_JSON="$pr" node - <<'NODE'
          const fs = require('fs');
          const fail = (message) => { console.error(message); process.exit(1); };
          const pages = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/nusa-release-open-issues-pages.json`, 'utf8'));
          const pull = JSON.parse(process.env.PR_JSON);
          const openIssues = Array.isArray(pages) ? pages.flat() : [];
          const critical = openIssues.filter((issue) => !issue?.pull_request && issue?.state === 'open' && /^P0(?:\s|:)/i.test(String(issue?.title || '')) && /\bRefs\s+#903\b/i.test(String(issue?.body || ''))).sort((a, b) => String(a?.created_at || '').localeCompare(String(b?.created_at || '')) || Number(a?.number || 0) - Number(b?.number || 0));
          if (critical.length === 0) process.exit(0);
          const active = critical[0];
          const closesActive = new RegExp(`(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\\s+#${active.number}\\b`, 'i').test(String(pull.body || ''));
          if (!closesActive) fail(`Release serialized behind canonical P0 #903 repair #${active.number}`);
          console.log(`Canonical P0 #903 serialization permits PR #${pull.number} to close active repair #${active.number}`);
          NODE

      - name: Verify durable control-plane Release clearance
        env:
          NUSA_RELEASE_CONTROL_URL: https://nusa-autopilot.desporin12.workers.dev/control-plane/release-check
        run: |
          cat > "$RUNNER_TEMP/nusa-release-control-check.mjs" <<'NODE'
          const fail = (message) => { console.error(message); process.exit(1); };
          const oidcUrl = process.env.ACTIONS_ID_TOKEN_REQUEST_URL;
          const oidcRequestToken = process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN;
          if (!oidcUrl || !oidcRequestToken) fail('GitHub OIDC environment is unavailable');
          const tokenUrl = new URL(oidcUrl);
          tokenUrl.searchParams.set('audience', 'nusa-autopilot');
          const oidcResponse = await fetch(tokenUrl, { headers: { authorization: `Bearer ${oidcRequestToken}`, accept: 'application/json' } });
          if (!oidcResponse.ok) fail(`OIDC token request failed: ${oidcResponse.status}`);
          const oidcBody = await oidcResponse.json();
          if (typeof oidcBody.value !== 'string' || !oidcBody.value) fail('OIDC token missing');
          const payload = { repository: process.env.GITHUB_REPOSITORY, prNumber: Number(process.env.PR_NUMBER), headSha: process.env.EXPECTED_HEAD, baseSha: process.env.AUDITED_BASE };
          const response = await fetch(process.env.NUSA_RELEASE_CONTROL_URL, { method: 'POST', headers: { authorization: `Bearer ${oidcBody.value}`, 'content-type': 'application/json' }, body: JSON.stringify(payload) });
          const body = await response.json().catch(() => ({}));
          if (!response.ok) fail(`Durable Release control rejected: ${response.status} ${body.error || 'UNKNOWN'}`);
          if (body.accepted !== true || body.status !== 'RELEASE_CONTROL_CLEAR' || body.repository !== payload.repository || body.prNumber !== payload.prNumber || String(body.headSha || '').toLowerCase() !== payload.headSha.toLowerCase() || String(body.baseSha || '').toLowerCase() !== payload.baseSha.toLowerCase() || body.globalReleaseFreeze !== false || !['NONE', 'CLEARED'].includes(body.holdState)) fail('Durable Release control proof invalid');
          if (body.liveAuthority !== 'NONE' || body.productionMutationAllowed !== false || body.aiAuthority !== 'ZERO_AUTHORITY') fail('Durable Release control safety invariant mismatch');
          console.log(`Durable Release control CLEAR: pr=${payload.prNumber} head=${payload.headSha} base=${payload.baseSha} hold=${body.holdState}`);
          NODE
          node "$RUNNER_TEMP/nusa-release-control-check.mjs"

      - name: Mint dedicated release authority token
        id: release_authority_token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.NUSA_RELEASE_AUTH_APP_ID }}
          private-key: ${{ secrets.NUSA_RELEASE_AUTH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Publish exact-head release authorization
        id: authorize
        env:
          AUTH_GH_TOKEN: ${{ steps.release_authority_token.outputs.token }}
          AUTH_CONTEXT: nusa/release-authorized
        run: |
          set -euo pipefail
          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          main="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          release_hold="$(jq -r 'if (.labels | type) != "array" then "invalid" elif any(.labels[]; (.name | type) != "string") then "invalid" elif any(.labels[]; (.name | ascii_downcase) == "hold") then "true" else "false" end' <<<"$pr")"
          test "$(jq -r '.state' <<<"$pr")" = "open"
          test "$(jq -r '.draft // false' <<<"$pr")" = "false"
          test "$release_hold" = "false"
          test "$(jq -r '.head.sha' <<<"$pr")" = "$EXPECTED_HEAD"
          test "$(jq -r '.base.ref' <<<"$pr")" = "main"
          test "$(jq -r '.base.repo.full_name' <<<"$pr")" = "$GITHUB_REPOSITORY"
          test "$(jq -r '.base.sha' <<<"$pr")" = "$AUDITED_BASE"
          test "$main" = "$AUDITED_BASE"
          expected_target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          expected_status_url="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$EXPECTED_HEAD"
          expected_creator='nusa-release-authority[bot]'
          status="$(GH_TOKEN="$AUTH_GH_TOKEN" gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$EXPECTED_HEAD" -f state=success -f context="$AUTH_CONTEXT" -f description="canonical Audit PASS; pr=$PR_NUMBER; base=$AUDITED_BASE" -f target_url="$expected_target_url")"
          echo 'published=true' >> "$GITHUB_OUTPUT"
          status_id="$(jq -r '.id // empty' <<<"$status")"
          jq -e --arg context "$AUTH_CONTEXT" --arg target "$expected_target_url" --arg status_url "$expected_status_url" --arg creator "$expected_creator" '.state == "success" and .context == $context and .target_url == $target and .url == $status_url and .creator.login == $creator and (.id | type == "number")' <<<"$status" >/dev/null
          observed_status="$(GH_TOKEN="$AUTH_GH_TOKEN" gh api "repos/$GITHUB_REPOSITORY/commits/$EXPECTED_HEAD/statuses" --jq ".[] | select(.id == $status_id)")"
          jq -e --argjson id "$status_id" --arg context "$AUTH_CONTEXT" --arg target "$expected_target_url" --arg status_url "$expected_status_url" --arg creator "$expected_creator" '.id == $id and .state == "success" and .context == $context and .target_url == $target and .url == $status_url and .creator.login == $creator' <<<"$observed_status" >/dev/null
          echo "Dedicated release authority published and re-read $AUTH_CONTEXT on exact head $EXPECTED_HEAD for audited base $AUDITED_BASE"

      - name: Re-verify durable control-plane clearance before merge
        env:
          NUSA_RELEASE_CONTROL_URL: https://nusa-autopilot.desporin12.workers.dev/control-plane/release-check
        run: node "$RUNNER_TEMP/nusa-release-control-check.mjs"

      - name: Re-verify authorization is still current before merge
        run: |
          set -euo pipefail
          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          main="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          release_hold="$(jq -r 'if (.labels | type) != "array" then "invalid" elif any(.labels[]; (.name | type) != "string") then "invalid" elif any(.labels[]; (.name | ascii_downcase) == "hold") then "true" else "false" end' <<<"$pr")"
          test "$(jq -r '.state' <<<"$pr")" = "open"
          test "$(jq -r '.draft // false' <<<"$pr")" = "false"
          test "$release_hold" = "false"
          test "$(jq -r '.head.sha' <<<"$pr")" = "$EXPECTED_HEAD"
          test "$(jq -r '.base.ref' <<<"$pr")" = "main"
          test "$(jq -r '.base.repo.full_name' <<<"$pr")" = "$GITHUB_REPOSITORY"
          test "$(jq -r '.base.sha' <<<"$pr")" = "$AUDITED_BASE"
          test "$main" = "$AUDITED_BASE"

      - name: Wait for protected-branch authorization propagation
        env:
          GH_TOKEN: ${{ steps.release_authority_token.outputs.token }}
          AUTH_CONTEXT: nusa/release-authorized
        run: |
          set -euo pipefail
          # GitHub can accept and expose an App-bound commit status before branch
          # protection has indexed it. Wait a bounded interval; each poll keeps the
          # immutable PR/head/base binding fail-closed.
          for poll in $(seq 1 10); do
            pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
            main="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
            test "$(jq -r '.state' <<<"$pr")" = "open"
            test "$(jq -r '.draft // false' <<<"$pr")" = "false"
            test "$(jq -r '.head.sha' <<<"$pr")" = "$EXPECTED_HEAD"
            test "$(jq -r '.base.ref' <<<"$pr")" = "main"
            test "$(jq -r '.base.sha' <<<"$pr")" = "$AUDITED_BASE"
            test "$main" = "$AUDITED_BASE"
            status="$(gh api "repos/$GITHUB_REPOSITORY/commits/$EXPECTED_HEAD/statuses" --jq '[.[] | select(.context == "nusa/release-authorized") | select(.state == "success")] | sort_by(.id) | last // empty')"
            if [ -n "$status" ]; then
              echo "Waiting for protected-branch evaluation to observe $AUTH_CONTEXT (poll $poll/10)."
              sleep 3
              continue
            fi
            echo "::error::Exact-head release authorization disappeared before protected-branch evaluation."
            exit 1
          done

      - name: Preflight protected-branch mergeability
        id: merge_preflight
        env:
          GH_TOKEN: ${{ steps.release_authority_token.outputs.token }}
        run: |
          set -euo pipefail
          unresolved="$(gh api graphql -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){reviewThreads(first:100){nodes{isResolved}}}}}' -f owner="$GITHUB_REPOSITORY_OWNER" -f name="${GITHUB_REPOSITORY#*/}" -F number="$PR_NUMBER" --jq '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false)] | length')"
          if ! [[ "$unresolved" =~ ^[0-9]+$ ]]; then
            echo "::error::Release preflight could not establish review-thread state."
            exit 1
          fi
          if [ "$unresolved" -gt 0 ]; then
            echo "merge_ready=false" >> "$GITHUB_OUTPUT"
            echo "BLOCKED Release preflight: unresolved_review_threads=$unresolved pr=$PR_NUMBER head=$EXPECTED_HEAD"
            exit 0
          fi
          echo "merge_ready=true" >> "$GITHUB_OUTPUT"
          echo "Release preflight CLEAR: pr=$PR_NUMBER head=$EXPECTED_HEAD unresolved_review_threads=0"

      - name: Canonical expected-head merge
        if: ${{ steps.merge_preflight.outputs.merge_ready == 'true' }}
        id: merge
        env:
          GH_TOKEN: ${{ steps.release_authority_token.outputs.token }}
        run: |
          set -euo pipefail
          merge_api_ok=false
          # A transient GitHub API failure (e.g. an empty 5xx body) must not end the release path: the exact-head
          # merge is attempted up to three times, and the fail-closed read-back below tolerates a failed read.
          for merge_attempt in 1 2 3; do
            if result="$(gh api --method PUT "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/merge" -f sha="$EXPECTED_HEAD" -f merge_method=merge)"; then
              if jq -e '.merged == true' <<<"$result" >/dev/null 2>&1; then merge_api_ok=true; break; fi
              echo "Merge API returned without merged=true (attempt $merge_attempt/3)."
            else
              echo "Merge API failed (attempt $merge_attempt/3)."
            fi
            pr_state="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '"\(.merged) \(.head.sha)"' 2>/dev/null || true)"
            # Stop retrying once the PR is merged or its head moved; an unreadable state retries.
            case "$pr_state" in
              "true "*) break ;;
              "false $EXPECTED_HEAD") ;;
              "false "*) echo "PR head moved; not retrying the merge."; break ;;
            esac
            sleep $((merge_attempt * 5))
          done
          echo "Verifying fail-closed that the exact-head merge is bound to the audited base."
          verified_merge_sha=''
          for poll in $(seq 1 8); do
            if ! pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" 2>/dev/null)" || ! jq -e . >/dev/null 2>&1 <<<"$pr"; then
              echo "PR read-back failed (poll $poll/8); retrying."
              sleep 3
              continue
            fi
            merged="$(jq -r '.merged // false' <<<"$pr")"
            head="$(jq -r '.head.sha // empty' <<<"$pr")"
            base_ref="$(jq -r '.base.ref // empty' <<<"$pr")"
            base="$(jq -r '.base.sha // empty' <<<"$pr")"
            merge_sha="$(jq -r '.merge_commit_sha // empty' <<<"$pr")"
            if [ "$merged" = "true" ] && [ "$head" = "$EXPECTED_HEAD" ] && [ "$base_ref" = "main" ] && [ "$base" = "$AUDITED_BASE" ] && [[ "$merge_sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
              merge_commit="$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$merge_sha" 2>/dev/null || echo '{}')"
              parent_count="$(jq -r '.parents | length' <<<"$merge_commit")"
              parent_base="$(jq -r '.parents[0].sha // empty' <<<"$merge_commit")"
              parent_head="$(jq -r '.parents[1].sha // empty' <<<"$merge_commit")"
              if [ "$parent_count" = "2" ] && [ "$parent_base" = "$AUDITED_BASE" ] && [ "$parent_head" = "$EXPECTED_HEAD" ]; then
                current_main="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha' 2>/dev/null || true)"
                if [ "$current_main" = "$merge_sha" ]; then verified_merge_sha="$merge_sha"; break; fi
                ancestry="$(gh api "repos/$GITHUB_REPOSITORY/compare/$merge_sha...$current_main" --jq '.status' 2>/dev/null || true)"
                if [ "$ancestry" = "ahead" ]; then verified_merge_sha="$merge_sha"; break; fi
              fi
            fi
            echo "Waiting for exact-head merge race to settle (poll $poll/8)..."
            sleep 2
          done
          if [ -z "$verified_merge_sha" ]; then
            if [ "$merge_api_ok" = "true" ]; then echo "::error::Merge API reported success, but the resulting merge could not be bound to audited base $AUDITED_BASE and exact head $EXPECTED_HEAD."; else echo "::error::Merge API failed and no equivalent audited exact-head merge could be proven."; fi
            exit 1
          fi
          echo "merged_main=$verified_merge_sha" >> "$GITHUB_OUTPUT"
          echo "Canonical deterministic Release bound PR #$PR_NUMBER to merge $verified_merge_sha at exact head $EXPECTED_HEAD and audited base $AUDITED_BASE"
          echo 'liveAuthority=NONE'
          echo 'productionMutationAllowed=false'
          echo 'aiAuthority=ZERO_AUTHORITY'

      - name: Revoke authorization if merge preflight blocks activation
        if: ${{ steps.merge_preflight.outputs.merge_ready == 'false' && steps.authorize.outputs.published == 'true' }}
        env:
          AUTH_GH_TOKEN: ${{ steps.release_authority_token.outputs.token }}
          AUTH_CONTEXT: nusa/release-authorized
        run: |
          set -euo pipefail
          GH_TOKEN="$AUTH_GH_TOKEN" gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$EXPECTED_HEAD" -f state=failure -f context="$AUTH_CONTEXT" -f description="canonical Release blocked before merge preflight" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null

      - name: Revoke authorization if exact-head merge did not complete
        if: ${{ failure() && steps.authorize.outputs.published == 'true' }}
        env:
          AUTH_GH_TOKEN: ${{ steps.release_authority_token.outputs.token }}
          AUTH_CONTEXT: nusa/release-authorized
        run: |
          set -euo pipefail
          GH_TOKEN="$AUTH_GH_TOKEN" gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$EXPECTED_HEAD" -f state=failure -f context="$AUTH_CONTEXT" -f description="canonical Release invalidated before verified merge" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
          echo "Invalidated $AUTH_CONTEXT on $EXPECTED_HEAD after release-path failure."

      - name: Start canonical post-merge main CI
        if: ${{ steps.merge_preflight.outputs.merge_ready == 'true' && steps.merge.outcome == 'success' }}
        id: ci
        env:
          MERGED_MAIN: ${{ steps.merge.outputs.merged_main }}
        run: |
          set -euo pipefail
          test -n "$MERGED_MAIN"
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          echo "merged_main=$MERGED_MAIN" >> "$GITHUB_OUTPUT"
          if [ "$current_main" != "$MERGED_MAIN" ]; then echo "Main advanced from audited merge $MERGED_MAIN to $current_main; newer Release/watchdog owns convergence."; exit 0; fi
          existing_ci_run=""
          for poll in $(seq 1 6); do
            exact_ci_runs="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$MERGED_MAIN&per_page=100" \
              | jq -c --arg sha "$MERGED_MAIN" '[.[].workflow_runs[]
                | select(.name == "CI" and .path == ".github/workflows/ci.yml" and .head_sha == $sha
                  and (.status == "queued" or .status == "in_progress" or .status == "pending"
                    or (.status == "completed" and .conclusion == "success")))]')"
            existing_ci_run="$(jq -r 'sort_by(.created_at) | reverse | .[0].id // empty' <<<"$exact_ci_runs")"
            if [ -n "$existing_ci_run" ]; then break; fi
            if [ "$poll" -lt 6 ]; then
              echo "Waiting for exact-main push CI to materialize before fallback dispatch (poll $poll/6)."
              sleep 3
            fi
          done
          if [ -n "$existing_ci_run" ]; then
            echo "Exact-main CI already owns convergence for $MERGED_MAIN via run $existing_ci_run; suppressing duplicate dispatch."
            exit 0
          fi
          failed_ci_run="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$MERGED_MAIN&per_page=100" \
            | jq -r --arg sha "$MERGED_MAIN" '[.[].workflow_runs[]
              | select(.name == "CI" and .path == ".github/workflows/ci.yml" and .head_sha == $sha
                and .status == "completed" and (.conclusion == "failure" or .conclusion == "timed_out" or .conclusion == "cancelled"))]
              | sort_by(.updated_at) | reverse | .[0].id // empty')"
          if [ -n "$failed_ci_run" ]; then
            echo "Exact-main CI attempt $failed_ci_run failed; preserving the existing bounded rerun recovery path and suppressing fallback dispatch."
            exit 0
          fi
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          if [ "$current_main" != "$MERGED_MAIN" ]; then echo "Main advanced during exact-main CI visibility grace from $MERGED_MAIN to $current_main; newer Release/watchdog owns convergence."; exit 0; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/dispatches" -f ref=main
          echo "Dispatched canonical main CI for merged revision $MERGED_MAIN"

      - name: Recover post-merge CI retries and dispatch Cloudflare Deploy
        if: ${{ steps.merge_preflight.outputs.merge_ready == 'true' && steps.merge.outcome == 'success' }}
        env:
          MERGED_MAIN: ${{ steps.ci.outputs.merged_main }}
        run: |
          set -euo pipefail
          read_release_api() {
            local response error_file attempt
            error_file="$(mktemp)"
            for attempt in 1 2 3; do
              if response="$(gh api --method GET "$@" 2>"$error_file")"; then
                rm -f "$error_file"
                printf '%s' "$response"
                return 0
              fi
              # Never retry auth/configuration/quota failures or print raw response data.
              if grep -Eq 'HTTP (400|401|403|404|409|422|429)' "$error_file" || ! grep -Eq 'unexpected end of JSON input|unexpected EOF|connection reset|TLS handshake timeout|timed out|HTTP 50[0234]' "$error_file"; then
                rm -f "$error_file"
                echo '::error::RELEASE_API_READ_BLOCKED; no automatic retry for this failure category.' >&2
                return 1
              fi
              if [ "$attempt" -lt 3 ]; then
                echo "::warning::RELEASE_API_READ_TRANSIENT attempt $attempt/3; bounded read-only retry." >&2
                sleep "$((attempt * 2))"
              fi
            done
            rm -f "$error_file"
            echo '::error::RELEASE_API_READ_RETRY_EXHAUSTED' >&2
            return 1
          }
          success=false
          for poll in $(seq 1 40); do
            current_main="$(read_release_api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
            if ! [[ "$current_main" =~ ^[0-9a-f]{40}$ ]]; then echo '::error::RELEASE_MAIN_SHA_INVALID'; exit 1; fi
            if [ "$current_main" != "$MERGED_MAIN" ]; then echo "Main advanced from $MERGED_MAIN to $current_main; newer Release/watchdog owns convergence."; exit 0; fi
            runs="$(read_release_api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$MERGED_MAIN&per_page=100")"
            successful_run="$(jq -r --arg sha "$MERGED_MAIN" '[.workflow_runs[] | select(.name == "CI" and .path == ".github/workflows/ci.yml" and .head_sha == $sha and .status == "completed" and .conclusion == "success")][0].id // empty' <<<"$runs")"
            if [ -n "$successful_run" ]; then echo "Post-merge CI SUCCESS recovered for $MERGED_MAIN via run $successful_run."; success=true; break; fi
            active_count="$(jq -r --arg sha "$MERGED_MAIN" '[.workflow_runs[] | select(.name == "CI" and .path == ".github/workflows/ci.yml" and .head_sha == $sha and (.status == "queued" or .status == "in_progress" or .status == "pending"))] | length' <<<"$runs")"
            if [ "$active_count" -gt 0 ]; then echo "Waiting for active post-merge CI on $MERGED_MAIN (poll $poll/40)..."; sleep 20; continue; fi
            failed_run_id="$(jq -r --arg sha "$MERGED_MAIN" '[.workflow_runs[] | select(.name == "CI" and .path == ".github/workflows/ci.yml" and .head_sha == $sha and .status == "completed" and (.conclusion == "failure" or .conclusion == "timed_out" or .conclusion == "cancelled"))] | sort_by(.updated_at) | reverse | .[0].id // empty' <<<"$runs")"
            failed_attempt="$(jq -r --arg sha "$MERGED_MAIN" '[.workflow_runs[] | select(.name == "CI" and .path == ".github/workflows/ci.yml" and .head_sha == $sha and .status == "completed" and (.conclusion == "failure" or .conclusion == "timed_out" or .conclusion == "cancelled"))] | sort_by(.updated_at) | reverse | .[0].run_attempt // 0' <<<"$runs")"
            if [ -n "$failed_run_id" ]; then
              if [ "$failed_attempt" -ge 3 ]; then echo "::error::Post-merge CI retry budget exhausted for $MERGED_MAIN after attempt $failed_attempt."; exit 1; fi
              echo "Post-merge CI attempt $failed_attempt failed; requesting bounded rerun for run $failed_run_id."
              if ! gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$failed_run_id/rerun-failed-jobs" >/dev/null; then gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$failed_run_id/rerun" >/dev/null; fi
              sleep 20
              continue
            fi
            echo "Waiting for post-merge CI run creation on $MERGED_MAIN (poll $poll/40)..."
            sleep 20
          done
          if [ "$success" != "true" ]; then echo "::error::Post-merge CI for $MERGED_MAIN produced no successful attempt before timeout."; exit 1; fi
          current_main="$(read_release_api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          if ! [[ "$current_main" =~ ^[0-9a-f]{40}$ ]]; then echo '::error::RELEASE_MAIN_SHA_INVALID'; exit 1; fi
          if [ "$current_main" != "$MERGED_MAIN" ]; then echo "Main advanced after CI recovery; newer convergence chain owns deployment."; exit 0; fi

          deploy_runs="$(read_release_api "repos/$GITHUB_REPOSITORY/actions/workflows/autopilot-cloudflare-deploy.yml/runs?head_sha=$MERGED_MAIN&per_page=100")"
          existing_deploy_run="$(jq -r --arg sha "$MERGED_MAIN" '
            [.workflow_runs[]
              | select(.path == ".github/workflows/autopilot-cloudflare-deploy.yml"
                and .head_sha == $sha
                and (
                  .status == "queued"
                  or .status == "in_progress"
                  or .status == "pending"
                  or .status == "waiting"
                  or .status == "requested"
                  or (.status == "completed" and .conclusion == "success")
                ))]
            | sort_by(.created_at)
            | reverse
            | .[0].id // empty
          ' <<<"$deploy_runs")"
          if [ -n "$existing_deploy_run" ]; then
            echo "Exact-main Cloudflare Deploy already owns convergence for $MERGED_MAIN via run $existing_deploy_run; suppressing duplicate Release dispatch."
            exit 0
          fi

          echo "Post-merge CI verified for $MERGED_MAIN with no active/successful exact-main Deploy; dispatching bounded fallback."
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/autopilot-cloudflare-deploy.yml/dispatches" -f ref=main -f "inputs[head_sha]=$MERGED_MAIN"

      - name: Dispatch exact-main runtime evidence and CI-gated downstream workflows directly
        if: ${{ steps.merge_preflight.outputs.merge_ready == 'true' && steps.merge.outcome == 'success' }}
        env:
          MERGED_MAIN: ${{ steps.ci.outputs.merged_main }}
        run: |
          set -euo pipefail
          CURRENT_MAIN="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          if [ "$CURRENT_MAIN" != "$MERGED_MAIN" ]; then echo "Main advanced from $MERGED_MAIN to $CURRENT_MAIN; newer Release chain owns post-merge evidence."; exit 0; fi
          dispatch_exact_main_downstream() {
            local workflow="$1"
            local allow_manual_disable="$2"
            local expected_job="$3"
            shift 3
            local state runs owner candidate_run candidate_status candidate_event jobs applicable_job
            state="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow" --jq '.state')"
            if [ "$state" = "disabled_manually" ] && [ "$allow_manual_disable" = "true" ]; then
              echo "::notice::Skipping intentionally disabled optional downstream workflow $workflow for $MERGED_MAIN."
              return 0
            fi
            if [ "$state" != "active" ]; then
              echo "::error::Unexpected downstream workflow state: workflow=$workflow state=$state" >&2
              return 1
            fi
            runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?head_sha=$MERGED_MAIN&per_page=100")"
            owner=""
            while IFS=$'\t' read -r candidate_run candidate_status candidate_event; do
              [ -n "$candidate_run" ] || continue
              jobs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$candidate_run/jobs?per_page=100")"
              applicable_job="$(jq -r --arg name "$expected_job" '
                [.jobs[] | select(.name == $name) | select(
                  .status == "queued" or .status == "pending" or .status == "in_progress" or .status == "waiting" or .status == "requested"
                  or (.status == "completed" and .conclusion == "success")
                )] | length > 0' <<<"$jobs")"
              if [ "$applicable_job" = "true" ] && [ "$workflow" = "autopilot-cloudflare-promote.yml" ]; then
                if [ "$candidate_status" != "completed" ] && [ "$candidate_event" != "workflow_run" ]; then
                  echo "Active Cloudflare workflow_dispatch run $candidate_run cannot prove its head_sha matches the requested promotion input; it does not own convergence."
                  applicable_job="false"
                elif [ "$candidate_status" = "completed" ]; then
                  production_sha="$(gh api "repos/$GITHUB_REPOSITORY/branches/cloudflare-production" --jq '.commit.sha')"
                  production_relation="$(gh api "repos/$GITHUB_REPOSITORY/compare/$MERGED_MAIN...$production_sha" --jq '.status')"
                  if [ "$production_relation" = "ahead" ] || [ "$production_relation" = "identical" ]; then
                    echo "Cloudflare run $candidate_run completed successfully and production contains exact main $MERGED_MAIN."
                  else
                    verified_tree="$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$MERGED_MAIN" --jq '.tree.sha')"
                    production_tree="$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$production_sha" --jq '.tree.sha')"
                    verified_apps_tree="$(gh api "repos/$GITHUB_REPOSITORY/git/trees/$verified_tree" --jq '.tree[] | select(.path == "apps" and .type == "tree") | .sha')"
                    production_apps_tree="$(gh api "repos/$GITHUB_REPOSITORY/git/trees/$production_tree" --jq '.tree[] | select(.path == "apps" and .type == "tree") | .sha')"
                    verified_autopilot_tree="$(gh api "repos/$GITHUB_REPOSITORY/git/trees/$verified_apps_tree" --jq '.tree[] | select(.path == "autopilot" and .type == "tree") | .sha')"
                    production_autopilot_tree="$(gh api "repos/$GITHUB_REPOSITORY/git/trees/$production_apps_tree" --jq '.tree[] | select(.path == "autopilot" and .type == "tree") | .sha')"
                    if [ -n "$verified_autopilot_tree" ] && [ "$verified_autopilot_tree" = "$production_autopilot_tree" ]; then
                      echo "Cloudflare run $candidate_run completed successfully and apps/autopilot tree matches exact main $MERGED_MAIN; no deployment-relevant change remains."
                    else
                      echo "Cloudflare run $candidate_run completed without proving exact-main promotion: main=$MERGED_MAIN production=$production_sha relation=$production_relation; it does not own convergence."
                      applicable_job="false"
                    fi
                  fi
                fi
              fi
              if [ "$applicable_job" = "true" ]; then
                owner="$candidate_run"
                break
              fi
            done < <(jq -r --arg sha "$MERGED_MAIN" '[.workflow_runs[]
              | select(.head_sha == $sha and (
                  .status == "queued" or .status == "in_progress" or .status == "pending"
                  or .status == "waiting" or .status == "requested"
                  or (.status == "completed" and .conclusion == "success")
                ))]
              | sort_by(.created_at) | reverse[] | [.id, .status, .event] | @tsv' <<<"$runs")
            if [ -n "$owner" ]; then
              echo "Exact-main downstream $workflow applicable job '$expected_job' owns convergence for $MERGED_MAIN via run $owner; suppressing duplicate dispatch."
              return 0
            fi
            gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/dispatches" -f ref=main "$@"
            echo "Dispatched exact-main downstream $workflow for $MERGED_MAIN."
          }

          dispatch_exact_main_downstream wo-0059-actual-paper-runtime.yml false actual-paper-runtime
          dispatch_exact_main_downstream autopilot-cloudflare-promote.yml false "Promote exact CI-verified Worker revision" -f "inputs[head_sha]=$MERGED_MAIN"
          dispatch_exact_main_downstream android-stable-release-trigger.yml true dispatch
          dispatch_exact_main_downstream windows-desktop-stable-release.yml false "Build and publish exact-main Windows installer"
